[package]
name = "xp-cli"
description = "xpanel 命令行：xp add / ls / done / export / stats / import / mcp / key / serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xp"
path = "src/main.rs"

[dependencies]
xp-core.workspace = true
xp-store.workspace = true
xp-server.workspace = true
xp-workspace.workspace = true
serde_json.workspace = true
ureq.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# 从密码库取用时解开界面交回来的内容（见 src/vault.rs）
base64.workspace = true
getrandom.workspace = true
sha2.workspace = true
hkdf = "0.12"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
