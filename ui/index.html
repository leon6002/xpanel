    <button class="btn primary" data-wx="note">${ico("note")}存成笔记</button><button class="btn" data-wx="todo" style="${cv(T.todo)}">${ico("todo")}转成待办</button>
    <button class="btn" data-wx="copy">${ico("copy")}复制 Markdown</button><button class="btn" data-wx="ai">${ico("ai")}交给 AI</button>
    <button class="btn" data-wx="readhere" title="下次只看这之后的">标为已处理</button><button class="btn danger" data-wx="del">删除</button><button class="btn ghost" data-wx="none">取消</button>`;
}
function sizeIbx(){const b=$("#ibx");if(!b||$("#view-inbox").hidden)return;const top=b.getBoundingClientRect().top+window.scrollY;b.style.height=Math.max(420,window.innerHeight-top-28)+"px"}
window.addEventListener("resize",sizeIbx);

function renderInbox(){
  if(S.tab!=="inbox")return;
  if(S.ibx!=="me"&&!(S.chats||[]).some(c=>c.id===S.ibx)){if(S.chatsLoaded)S.ibx="me"}
  const c=S.ibx==="me"?null:(S.chats||[]).find(x=>x.id===S.ibx);
  renderIbxList();sizeIbx();
  const head=$("#ibxHead"),st=$("#ibxStream");
  const qFocused=document.activeElement&&document.activeElement.id==="ibxQ";const qPos=qFocused?document.activeElement.selectionStart:0;
  head.innerHTML=renderIbxHead(c);
  if(qFocused){const q=$("#ibxQ");q.focus();q.selectionStart=q.selectionEnd=qPos}
  if(c&&(!S.msgs||S.msgs.chat!==c.id||S.msgs.key!==chatKey(c))&&!S.msgsLoading){
    S.msgsLoading=true;loadMsgs(c.id).catch(e=>toast(errText(e))).finally(()=>{S.msgsLoading=false;renderInbox()});
  }
  const atBottom=st.scrollHeight-st.scrollTop-st.clientHeight<60;const keep=st.scrollTop;
  st.innerHTML=c?renderChatStream(c):(S.ibx==="me"?renderMeStream():`<div class="ibx-empty">正在读取…</div>`);
  st.classList.toggle("selecting",S.ibxSel.size>0);
  hydrate(st);
  const want=S.ibxScroll;
  if(want==="unread"&&c&&S.msgs&&S.msgs.chat===c.id){const nw=$("#ibxNew");if(nw)st.scrollTop=nw.offsetTop-st.offsetTop-40;else st.scrollTop=st.scrollHeight;S.ibxScroll=null}
  else if(want==="bottom"||(atBottom&&want!=="keep")){st.scrollTop=st.scrollHeight;if(want==="bottom"&&(c?S.msgs&&S.msgs.chat===c.id:true))S.ibxScroll=null}
  else st.scrollTop=keep;
  if(want==="keep")S.ibxScroll=null;
  st.querySelectorAll("img").forEach(img=>img.addEventListener("load",()=>{if(S.ibxStick)st.scrollTop=st.scrollHeight},{once:true}));
  S.ibxStick=atBottom||want==="bottom";

}

function ibxAutoGrow(){ibxIn.style.height="auto";ibxIn.style.height=Math.min(ibxIn.scrollHeight,220)+"px"}
function saveIbxDraft(){try{localStorage.setItem("wb-ibxdraft",JSON.stringify({text:ibxIn.value,files:S.ibxFiles.filter(f=>f.name).map(({name,label,isImg})=>({name,label,isImg}))}))}catch(e){}}
function loadIbxDraft(){try{const d=JSON.parse(localStorage.getItem("wb-ibxdraft")||"null");if(!d)return;ibxIn.value=d.text||"";S.ibxFiles=(d.files||[]).map(f=>({...f,id:Math.random().toString(36).slice(2),url:"",uploading:false}));renderIbxFiles();ibxAutoGrow()}catch(e){}}
function renderIbxFiles(){const box=$("#ibxFiles");box.innerHTML=S.ibxFiles.map(f=>`<div class="cap-file ${f.uploading?"up":""}" title="${esc(f.label)}">${f.isImg?`<img src="${esc(f.url||(ASSET_PREFIX+f.name))}" alt="${esc(f.label)}">`:`<span class="fname">📎 ${esc(f.label)}</span>`}<button data-ibxfdel="${f.id}" aria-label="移除" title="移除">×</button></div>`).join("");hydrate(box)}
function addIbxFile(file){
  const f={id:Math.random().toString(36).slice(2),label:fileLabel(file),isImg:isImgFile(file),url:isImgFile(file)?URL.createObjectURL(file):"",uploading:true,name:null};
  S.ibxFiles.push(f);renderIbxFiles();
  uploadAsset(file).then(n=>{f.name=n;f.uploading=false;saveIbxDraft();renderIbxFiles()}).catch(err=>{S.ibxFiles=S.ibxFiles.filter(x=>x!==f);renderIbxFiles();toast("保存失败："+errText(err))});
}
async function sendInbox(){
  const raw=ibxIn.value.trim();
  if(S.ibxFiles.some(f=>f.uploading)){toast("截图还在保存，稍等一下");return}
  const files=S.ibxFiles.filter(f=>f.name);if(!raw&&!files.length)return;
  const p=raw?parseCapture(raw,"inbox"):{title:"",body:"",tags:[],device:""};
  if(!p.title)p.title=(files.some(f=>f.isImg)?"截图 ":"附件 ")+nowLabel();
  else if(p.title.length>60){p.body=[p.title,p.body].filter(Boolean).join("\n");p.title=p.title.slice(0,40)+"…"}
  const att=files.map(f=>assetMd(f.isImg,f.label,f.name)).join("\n\n");if(att)p.body=[p.body,att].filter(Boolean).join("\n\n");
  const now=Date.now();const item={id:newId(),type:"inbox",title:p.title,body:p.body||"",tags:p.tags||[],device:p.device||"",done:false,pinned:false,createdAt:now,updatedAt:now};
  if(p.priority)item.priority=p.priority;if(p.due)item.due=p.due;
  const keep={text:ibxIn.value,files:S.ibxFiles};
  ibxIn.value="";S.ibxFiles=[];renderIbxFiles();ibxAutoGrow();try{localStorage.removeItem("wb-ibxdraft")}catch(e){}
  S.ibx="me";S.ibxScroll="bottom";
  try{await applyOp({kind:"upsert",item},()=>S.items.push(item))}catch(e){ibxIn.value=keep.text;S.ibxFiles=keep.files;renderIbxFiles();saveIbxDraft()}
  ibxIn.focus();
}
ibxIn.addEventListener("input",()=>{ibxAutoGrow();saveIbxDraft()});
ibxIn.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendInbox()}});
$("#ibxSend").onclick=sendInbox;
$("#ibxFiles").onclick=e=>{const b=e.target.closest("[data-ibxfdel]");if(!b)return;S.ibxFiles=S.ibxFiles.filter(f=>f.id!==b.dataset.ibxfdel);renderIbxFiles();saveIbxDraft()};
loadIbxDraft();

/* ---- 归类 ---- */
function toastUndo(m,fn){const t=$("#toast");t.innerHTML=`${esc(m)}<button>撤销</button>`;t.hidden=false;t.querySelector("button").onclick=()=>{t.hidden=true;fn()};clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,6000)}
async function triage(it,type){
  if(type==="link"&&!findTarget((it.body||"")+"\n"+(it.title||""))){S.editing=it.id;renderInbox();const ed=document.querySelector(`[data-ed="${CSS.escape(it.id)}"]`);if(ed){ed.querySelector(".e-type").value="link";ed.querySelector(".e-body").focus()}toast("入口需要网址或路径，写在详情里");return}
  const ch={type};if(INBOX_AUTO.test(it.title||"")&&type==="todo")ch.title="看截图 "+it.title.slice(3);
  S.ibxScroll="keep";
  try{await patch(it,ch)}catch(e){return}
  toastUndo(`已归到「${T[type].name}」`,()=>{const cur=S.items.find(x=>x.id===it.id);if(cur)patch(cur,{type:"inbox",title:it.title}).catch(()=>{})});
}
async function bulkInbox(k){
  const sel=inboxItems().filter(i=>S.ibxSel.has(i.id));if(!sel.length)return;
  if(k==="none"){S.ibxSel.clear();renderInbox();return}
  if(k==="del"){S.ibxSel.clear();for(const it of sel)await removeItem(it.id).catch(()=>{});toast(`已删除 ${sel.length} 条`);return}
  if(k==="merge"){
    const first=sel[0];const parts=sel.map((it,i)=>{const t=INBOX_AUTO.test(it.title||"")&&it.body?"":it.title;return i===0?(it.body||""):[t,it.body].filter(Boolean).join("\n")}).filter(Boolean);
    const tags=[...new Set(sel.flatMap(i=>i.tags||[]))];
    S.ibxSel.clear();
    await patch(first,{type:"note",title:INBOX_AUTO.test(first.title||"")?"整理的记录 "+nowLabel():first.title,body:parts.join("\n\n"),tags}).catch(()=>{});
    for(const it of sel.slice(1))await removeItem(it.id).catch(()=>{});
    toast(`${sel.length} 条合成了一篇笔记`);return}
  S.ibxSel.clear();for(const it of sel)await patch(it,{type:k}).catch(()=>{});
  toast(`${sel.length} 条归到「${T[k].name}」`);
}

/* ---- 微信消息操作 ---- */
const selIds=()=>(S.msgs?S.msgs.list:[]).filter(m=>S.ibxSel.has(m.id)).map(m=>m.id);
async function mdOf(ids){
  const path="/inbox/markdown?ids="+encodeURIComponent(ids.join(","));
  if(IS_APP){const r=await invoke("api_call",{method:"GET",path,body:null});if(r.status>=400)throw (r.body&&r.body.error)||"读取失败";return typeof r.body==="string"?r.body:JSON.stringify(r.body)}
  const r=await fetch("/api/v1"+path,{headers:{"X-Actor":"ui"}});if(!r.ok)throw "读取失败 "+r.status;return r.text();
}
async function markRead(c,time){await v1("PATCH","/inbox/chats/"+encodeURIComponent(c.id),{readUpTo:time});await loadChats();renderInbox()}
async function wxAction(k,c){
  const ids=selIds();
  try{
    if(k==="none"){S.ibxSel.clear();renderInbox();return}
    if(k==="selunread"){unreadMsgs(c).forEach(m=>S.ibxSel.add(m.id));renderInbox();return}
    if(k==="readall"){const l=S.msgs.list[S.msgs.list.length-1];if(l){await markRead(c,l.time);toast("都标为已处理了")}return}
    if(!ids.length)return;
    const lastT=S.msgs.list.filter(m=>S.ibxSel.has(m.id)).map(m=>m.time).sort().pop();
    if(k==="note"||k==="todo"){
      const it=await v1("POST","/inbox/messages/to-item",{ids,type:k,markRead:true});
      S.ibxSel.clear();await load();await loadChats();renderInbox();
      if(k==="note"){openSide(it.id);toastUndo(`已存成笔记「${it.title}」，在右侧打开了`,()=>{closeSide();removeItem(it.id).catch(()=>{})})}
      else toastUndo(`已转成待办「${it.title}」`,()=>{removeItem(it.id).catch(()=>{})});
      return}
    if(k==="copy"){const md=await mdOf(ids);toast(await copyText(md)?`已复制 ${ids.length} 条消息（Markdown）`:"复制失败");return}
    if(k==="ai"){const md=(await mdOf(ids)).replace(/!?\[([^\]]*)\]\(asset:[^)]+\)/g,"[附件：$1]");
      const prompt=`下面是微信聊天「${c.name}」里的 ${ids.length} 条消息。请帮我整理：\n1. 讨论的要点和结论\n2. 需要我做的事（做什么、给谁、什么时候）\n3. 需要我回复或确认的问题\n\n${md}`;
      openAgent({id:"",type:"note",title:c.name,body:""},prompt);return}
    if(k==="readhere"){await markRead(c,lastT);S.ibxSel.clear();renderInbox();toast("已标为处理到 "+shortTime(lastT));return}
    if(k==="del"){const b=document.querySelector('[data-wx="del"]');if(b&&b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent=`再点一次删除 ${ids.length} 条`;return}
      await v1("POST","/inbox/messages/delete",{ids});S.ibxSel.clear();S.msgs=null;await loadChats();renderInbox();toast(`已删除 ${ids.length} 条（再导入也不会回来）`);return}
  }catch(e){toast(errText(e))}
}

/* ---- 导入微信聊天记录 ---- */
function fileB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej("读取文件失败");r.readAsDataURL(file)})}
const NOT_WECHAT="不是能认出来的微信聊天记录";
/** 返回 false 表示这不是微信导出（调用方按普通附件处理） */
async function wxImportFile(file){
  if(file.size>500*1024*1024){toast("文件超过 500MB，请在微信里分几次导出");return true}
  toast("正在读取 "+file.name+"…");
  let data,pv;
  try{data=await fileB64(file);pv=await v1("POST","/inbox/wechat/preview",{data,name:file.name})}
  catch(e){if(String(errText(e)).includes(NOT_WECHAT))return false;toast(errText(e));return true}
  $("#toast").hidden=true;openImport(file.name,data,pv);return true;
}

/* ================= 外观：跟随系统 / 浅色 / 深色 ================= */
const THEMES=[["system","跟随系统","auto"],["light","浅色","sun"],["dark","深色","moon"]];
function curTheme(){try{const t=localStorage.getItem("wb-theme");return t==="light"||t==="dark"?t:"system"}catch(e){return "system"}}
function applyTheme(t){
  if(t==="system")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  const [,name,icon]=THEMES.find(x=>x[0]===t);const next=THEMES[(THEMES.findIndex(x=>x[0]===t)+1)%3];
  const b=$("#themeBtn");b.innerHTML=ico(icon);b.title=`外观：${name}（点一下换成${next[1]}）`;b.setAttribute("aria-label",b.title);
  // 桌面版的窗口标题栏也跟着换
  try{const w=TAURI&&TAURI.window&&TAURI.window.getCurrentWindow();if(w&&w.setTheme)w.setTheme(t==="system"?null:t).catch(()=>{})}catch(e){}
}
$("#themeBtn").onclick=()=>{const t=THEMES[(THEMES.findIndex(x=>x[0]===curTheme())+1)%3][0];try{t==="system"?localStorage.removeItem("wb-theme"):localStorage.setItem("wb-theme",t)}catch(e){}applyTheme(t);toast("外观："+THEMES.find(x=>x[0]===t)[1])};
applyTheme(curTheme());


/* ================= 右侧阅读面板 =================
   任意条目（主要是笔记）在右边完整展示，左边照常切页面、干活。可以拖左边缘调宽度，也可以铺满。 */
S.side=null;S.sideMode="read";S.sideFull=false;
function markViewing(){document.querySelectorAll(".viewing").forEach(x=>x.classList.remove("viewing"));if(S.side)document.querySelectorAll(`.main [data-id="${CSS.escape(S.side)}"],#ibxStream [data-iid="${CSS.escape(S.side)}"]`).forEach(x=>x.classList.add("viewing"))}
function sideWidth(){try{return +localStorage.getItem("wb-sidew")||560}catch(e){return 560}}
function openSide(id){if(S.side&&S.side!==id)saveSide();S.side=id;S.sideMode="read";S.sideFull=false;S.sideKey=null;renderSide();markViewing();sizeIbx();placeCapture();$("#side").querySelector(".side-body")?.scrollTo(0,0)}
function closeSide(){saveSide();S.side=null;S.sideFull=false;renderSide();sizeIbx();markViewing();placeCapture()}
function sideMeta(it){
  const p=[];if(it.category)p.push(`<span>${ico("folder")} ${esc(it.category)}</span>`);
  if(it.priority)p.push(priHTML(it));const di=dueInfo(it);if(di)p.push(`<span class="due ${di.cls}">${di.text}</span>`);
  (it.tags||[]).forEach(t=>p.push(`<span>#${esc(t)}</span>`));if(it.device)p.push(`<span class="dev">${esc(it.device)}</span>`);
  if(it.source&&it.source.kind==="wechat")p.push(`<span>来自微信「${esc(it.source.chat||"")}」</span>`);
  const pc=progressChip(it);if(pc)p.push(pc);const wc=wsChip(it);if(wc)p.push(wc);
  return p.join("");
}
function renderSide(){
  const sh=$(".shell"),el=$("#side");
  const it=S.side&&S.items.find(x=>x.id===S.side);
  if(S.side&&!it&&S.items.length){S.side=null}
  sh.classList.toggle("side-open",!!it);sh.classList.toggle("side-full",!!it&&S.sideFull);
  sh.style.setProperty("--side-w",Math.max(360,Math.min(sideWidth(),window.innerWidth-700))+"px");
  if(!it){el.hidden=true;el.innerHTML="";S.sideKey=null;return}
  el.hidden=false;
  // 正在右侧编辑时不打断（别的地方改了同一条，保存时以这里为准）
  const a=document.activeElement;if(a&&el.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName))return;
  const key=`${it.id}|${it.updatedAt}|${S.sideMode}|${S.sideFull}|${(S.qaPending[it.id]||[]).length}`;if(key===S.sideKey)return;S.sideKey=key;
  const t=T[it.type]||{name:"收件箱",c:"note"};const edit=S.sideMode==="edit";
  const scroll=el.querySelector(".side-body")?.scrollTop||0;
  el.innerHTML=`<div class="side-grip" title="拖动调整宽度"></div>
    <div class="side-h" style="${cv(t)}"><span class="kind">${esc(t.short||t.name)}</span>
      ${edit?`<input id="sideTitle" value="${esc(it.title)}" placeholder="标题" aria-label="标题">`:`<h2 title="${esc(it.title)}">${esc(it.type==="note"?noteTitle(it):it.title)}</h2>`}
      <div class="seg" role="group" aria-label="显示方式"><button data-smode="read" aria-pressed="${!edit}">阅读</button><button data-smode="edit" aria-pressed="${edit}">编辑</button></div>
      ${it.type==="note"?`<button class="ic" data-sact="notes" title="在笔记页打开" aria-label="在笔记页打开">${ico("note")}</button>`:""}
      <button class="ic" data-sact="ai" title="${myWorkspace(it)?"继续交给 AI":"交给 AI"}" aria-label="交给 AI">${ico("ai")}</button>
      <button class="ic" data-sact="copy" title="复制 Markdown" aria-label="复制">${ico("copy")}</button>
      <button class="ic" data-sact="full" title="${S.sideFull?"还原":"铺满"}" aria-label="${S.sideFull?"还原":"铺满"}">${ico(S.sideFull?"shrink":"expand")}</button>
      <button class="ic" data-sact="close" title="关闭（Esc）" aria-label="关闭">${ico("x")}</button></div>
    <div class="side-meta">${sideMeta(it)}</div>
    <div class="side-body">${edit?`<textarea id="sideEd" placeholder="支持 Markdown，可以直接粘贴截图" aria-label="内容">${esc(it.body||"")}</textarea>`:`<div class="md qa-host">${it.body?mdHTML(it.body):`<p style="color:var(--faint)">没有正文，点「编辑」开始写。</p>`}</div>${progressHTML(it)}`}</div>
    <div class="side-foot"><span id="sideSaved">${ago(it.updatedAt)}更新</span><span class="grow"></span><span>${edit?"粘贴截图 / 拖入文件即可插入":"Esc 关闭"}</span></div>`;
  const body=el.querySelector(".side-body");
  if(!edit){hydrate(body);body.querySelectorAll("img[data-w]").forEach(i=>i.style.width=i.dataset.w+"px");attachQA(body.querySelector(".qa-host"),it)}
  body.scrollTop=scroll;
  const ed=$("#sideEd");if(ed)ed.addEventListener("input",schedSide);
  $("#sideTitle")?.addEventListener("input",schedSide);
}
function progressHTML(it){
  const list=(it.agentProgress||[]).slice().reverse();if(!list.length)return "";
  return `<section class="aiprog"><h3>${ico("ai")} AI 进展</h3>${list.map(p=>{const [n,c]=AI_STATUS[p.status]||AI_STATUS.working;
    return `<div class="aip"><div class="aip-h"><span class="aistat" style="--c:var(--${c})">${n}</span><span>${esc(p.by||"AI")}</span><span>${esc(new Date(p.at).toLocaleString())}</span></div>
      <div class="md">${mdHTML(p.text)}</div>${(p.files||[]).length?`<div class="aip-f">${p.files.map(f=>`<code>${esc(f)}</code>`).join(" ")}</div>`:""}</div>`}).join("")}</section>`;
}
let sideT=null;
function schedSide(){$("#sideSaved").textContent="正在保存…";clearTimeout(sideT);sideT=setTimeout(saveSide,700)}
async function saveSide(){
  clearTimeout(sideT);sideT=null;
  const it=S.side&&S.items.find(x=>x.id===S.side);const ed=$("#sideEd");if(!it||!ed)return;
  const title=$("#sideTitle")?$("#sideTitle").value.trim():it.title;const body=ed.value;
  if(title===it.title&&body===(it.body||""))return;
  if(!title&&it.type!=="note"){$("#sideSaved").textContent="标题不能为空";return}
  try{await patch(it,{title,body});const s=$("#sideSaved");if(s)s.textContent="已保存"}catch(e){const s=$("#sideSaved");if(s)s.textContent="保存失败"}
}
$("#side").addEventListener("focusout",e=>{if(e.target.id==="sideEd"||e.target.id==="sideTitle")setTimeout(()=>{saveSide().then(()=>{if(!$("#side").contains(document.activeElement))renderSide()})},0)});
$("#side").addEventListener("click",async e=>{
  const it=S.items.find(x=>x.id===S.side);if(!it)return;
  const m=e.target.closest("[data-smode]");if(m){await saveSide();S.sideMode=m.dataset.smode;document.activeElement.blur();renderSide();if(S.sideMode==="edit")$("#sideEd")?.focus();return}
  const a=e.target.closest("[data-sact]")?.dataset.sact;if(!a)return;
  if(a==="close"){closeSide();return}
  if(a==="ai"){await saveSide();openAgent(S.items.find(x=>x.id===S.side)||it);return}
  if(a==="full"){S.sideFull=!S.sideFull;renderSide();return}
  if(a==="copy"){await saveSide();const cur=S.items.find(x=>x.id===S.side)||it;toast(await copyText(`# ${cur.title}\n\n${cur.body||""}`)?"已复制":"复制失败");return}
  if(a==="notes"){await saveSide();S.noteSel=it.id;S.noteMode="preview";closeSide();setTab("note");return}
});
$("#side").addEventListener("dblclick",e=>{if(S.sideMode==="read"&&e.target.closest(".side-body .md")&&!e.target.closest("img,a")){S.sideMode="edit";renderSide();$("#sideEd")?.focus()}});
$("#side").addEventListener("pointerdown",e=>{
  const g=e.target.closest(".side-grip");if(!g)return;e.preventDefault();
  const el=$("#side"),x0=e.clientX,w0=el.getBoundingClientRect().width;let w=w0;el.classList.add("resizing");g.setPointerCapture(e.pointerId);
  const move=ev=>{w=Math.max(360,Math.min(window.innerWidth-700,w0+x0-ev.clientX));$(".shell").style.setProperty("--side-w",w+"px")};
  const up=()=>{g.removeEventListener("pointermove",move);g.removeEventListener("pointerup",up);el.classList.remove("resizing");try{localStorage.setItem("wb-sidew",Math.round(w))}catch(x){}sizeIbx()};
  g.addEventListener("pointermove",move);g.addEventListener("pointerup",up);
});
window.addEventListener("resize",()=>{if(S.side){S.sideKey=null;renderSide()}});
window.addEventListener("beforeunload",()=>{if(sideT)saveSide()});

/* ================= 笔记展开成项目（给 AI 当工作目录） =================
   交给 AI 时可以把条目展开成一个项目文件夹：.xpanel/ 里放任务说明、笔记原文、编号截图，AI 在项目里干活。
   笔记之后再贴内容，这台电脑上的 xpanel 会自动同步进去；「继续」时只告诉 AI 新增了什么。 */
S.templates=null;
async function loadTemplates(){try{S.templates=(await v1("GET","/templates")).templates||[]}catch(e){S.templates=S.templates||[]}return S.templates}
const tplById=id=>(S.templates||[]).find(t=>t.id===id)||(S.templates||[])[0]||{id:"general",name:"通用",goal:"",prompt:"请先读 .xpanel/TASK.md 和 .xpanel/note.md。",resume:""};
function myWorkspace(it){
  const id=thisDevId(),hn=(S.hostname||"").toLowerCase();
  return (it.workspaces||[]).find(w=>(id&&w.deviceId===id)||(!w.deviceId&&hn&&String(w.hostname||"").toLowerCase()===hn))||null;
}
const hasImages=it=>/\]\(asset:[^)]+\.(png|jpe?g|gif|webp|bmp)\)/i.test(it.body||"");
function wsRoot(){try{return localStorage.getItem("wb-wsroot")||""}catch(e){return ""}}
const AI_STATUS={working:["进行中","todo"],done:["完成","link"],blocked:["卡住了","issue"]};
function progressChip(it){
  const p=(it.agentProgress||[]).slice(-1)[0];if(!p)return "";
  const [n,c]=AI_STATUS[p.status]||AI_STATUS.working;
  return `<span class="aistat" style="--c:var(--${c})" title="${esc(p.by||"AI")} · ${esc(new Date(p.at).toLocaleString())}\n${esc(String(p.text).slice(0,300))}">AI ${n}</span>`;
}
function wsChip(it){
  const w=myWorkspace(it);if(!w)return "";
  return `<button class="wschip" data-wsopen="${esc(w.path)}" title="打开项目文件夹 ${esc(w.path)}">${ico("folder")}${esc(w.name||"项目")}</button>`;
}
/** 记下项目：条目上的 workspaces，和这台设备的「项目」列表 */
async function recordWorkspace(it,path,name,tplId,agent){
  const cur=S.items.find(x=>x.id===it.id)||it;
  const w={deviceId:thisDevId(),hostname:S.hostname||"",path,name,template:tplId,createdAt:Date.now()};
  const list=(cur.workspaces||[]).filter(x=>x.path!==path&&!(w.deviceId&&x.deviceId===w.deviceId));
  await patch(cur,{workspaces:[...list,w]}).catch(()=>{});
  const d=(S.devices||[]).find(x=>x.id===thisDevId());
  if(d&&!(d.projects||[]).some(p=>String(p.path).toLowerCase()===path.toLowerCase())){
    try{await v1("PATCH","/devices/"+encodeURIComponent(d.id),{projects:[...(d.projects||[]),{name,path,agent:agent||"",note:"由笔记「"+(cur.title||"")+"」生成"}]})}catch(e){}
  }
}
/* 笔记改了就同步到这台电脑上的项目（没变化时桌面版直接跳过） */
let wsSyncT=null,wsSyncing=false;
function scheduleWsSync(){if(!IS_APP)return;clearTimeout(wsSyncT);wsSyncT=setTimeout(syncWorkspaces,1200)}
async function syncWorkspaces(){
  if(wsSyncing||!IS_APP)return;wsSyncing=true;
  try{
    for(const it of S.items){const w=myWorkspace(it);if(!w)continue;
      try{const r=await invoke("workspace_sync",{item:it,path:w.path,force:false});
        if(r&&!r.skipped&&!r.empty)toast(`已同步到项目「${w.name}」：${r.summary}`)}catch(e){}
    }
  }finally{wsSyncing=false}
}

/* ---- 交给 AI 对话框 ---- */
function openAgent(it,promptText){
  if(!IS_APP){copyText(promptText||buildPrompt(it)).then(ok=>toast(ok?"已复制提示词，粘贴到任意 AI 即可":"复制失败"));return}
  const agents=(S.cfg&&S.cfg.agents)||[];
  let pick=0;try{const last=localStorage.getItem("wb-agent");const i=agents.findIndex(a=>a.name===last);if(i>=0)pick=i}catch(e){}
  const real=!!S.items.find(x=>x.id===it.id);
  const ws=real?myWorkspace(it):null;
  const st={proj:real&&!promptText&&(!!ws||it.type==="note"||hasImages(it)),edited:false,check:null,defaults:null};
  const tplOpts=()=>(S.templates||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  const root=$("#modalRoot");
  root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="aTitle">
    <h2 id="aTitle">${ws?"继续交给 AI":"交给 AI 处理"}</h2>
    ${real&&!promptText?`<label class="projtoggle"><input type="checkbox" id="aProj" ${st.proj?"checked":""}> 作为项目交给 AI<span class="hint">在单独的文件夹里干活，笔记的内容和截图都放进去；之后笔记再更新会自动同步</span></label>`:""}
    <div id="aProjBox" class="projbox" ${st.proj?"":"hidden"}>
      ${ws?`<div class="projcur">${ico("folder")}<b>${esc(ws.name)}</b><span class="path">${esc(ws.path)}</span><button class="btn ghost" data-wsopen="${esc(ws.path)}">打开文件夹</button></div>
        <div class="hint" id="aDiff">正在同步笔记…</div>`
      :`<div class="grid2"><label class="field">项目名<input id="aName" placeholder="leap-motor-code" autocomplete="off" spellcheck="false"></label>
        <label class="field">放在<input id="aRoot" placeholder="D:\\codes" spellcheck="false"></label></div>
        <div class="hint" id="aPath">&nbsp;</div>
        <div class="row"><label class="field" style="flex:1">任务模板<select id="aTpl">${tplOpts()}</select></label>
          <button class="btn ghost" id="aTplEdit" style="align-self:flex-end">管理模板…</button>
          <label class="toggle" style="align-self:flex-end"><input type="checkbox" id="aGit" checked> git init</label></div>`}
    </div>
    <div class="agents" id="aList">${agents.map((a,i)=>`<button class="agent" data-i="${i}" aria-pressed="${i===pick}">${ico("ai")}${esc(a.name)}</button>`).join("")||`<span class="hint">还没有配置 AI，去「设置」里添加</span>`}</div>
    <label class="field" id="aCwdBox" ${st.proj?"hidden":""}>工作目录（AI 在这个文件夹里干活）<input id="aCwd" value="${esc(localDirOf(it)||(S.cfg&&S.cfg.agentCwd)||"")}" placeholder="留空 = 用户目录，例如 D:\\Workbench 或 \\\\NAS\\share"></label>
    <label class="field">提示词<textarea id="aPrompt"></textarea></label>
    <div class="err" id="aErr"></div>
    <div class="row"><button class="btn primary" id="aGo" ${agents.length?"":"disabled"}>${ico("ai")}${ws?"继续":"启动"}</button>
      ${!ws&&real?`<button class="btn" id="aMake" ${st.proj?"":"hidden"}>${ico("folder")}只生成项目</button>`:""}
      <button class="btn ghost" id="aCancel">取消</button><span style="flex:1"></span><button class="btn" id="aCopy">${ico("copy")}只复制提示词</button></div>
  </div></div>`;
  const P=$("#aPrompt");
  const setPrompt=v=>{if(!st.edited)P.value=v};
  P.addEventListener("input",()=>st.edited=true);
  const tpl=()=>tplById($("#aTpl")?$("#aTpl").value:(ws&&ws.template)||"general");
  const plainPrompt=promptText||buildPrompt(it);
  const refresh=()=>{
    $("#aProjBox").hidden=!st.proj;$("#aCwdBox").hidden=st.proj;const mk=$("#aMake");if(mk)mk.hidden=!st.proj;
    if(!st.proj){setPrompt(plainPrompt);return}
    if(!ws)setPrompt(tpl().prompt);
  };
  // 新项目：建议的名字和目录；输入时检查
  let checkT=null;
  const check=()=>{clearTimeout(checkT);checkT=setTimeout(async()=>{
    if(!$("#aName"))return;const name=$("#aName").value.trim(),r=$("#aRoot").value.trim();const out=$("#aPath");
    if(!name||!r){out.textContent="填好项目名和目录";st.check=null;return}
    try{const c=await invoke("workspace_check",{root:r,name,itemId:it.id});st.check=c;
      out.innerHTML=`${esc(c.path)}　<b style="color:var(--${c.state==="new"?"accent":c.state==="ours"?"todo":"danger"})">${{new:"新建",ours:"已存在，接着用",other:"已经是另一条笔记的项目，换个名字",busy:"已存在且不是空文件夹，换个名字"}[c.state]}</b>`}
    catch(e){st.check=null;out.innerHTML=`<span style="color:var(--danger)">${esc(errText(e))}</span>`}
  },250)};
  (async()=>{
    if(!S.templates)await loadTemplates();
    if($("#aTpl")){$("#aTpl").innerHTML=tplOpts();$("#aTpl").value=(it.type==="note"&&hasImages(it)&&(S.templates||[]).some(t=>t.id==="rebuild"))?"rebuild":"general"}
    if(!ws&&real){
      try{const d=await invoke("workspace_defaults",{title:it.title||"",itemId:it.id,root:wsRoot()||null});st.defaults=d;$("#aName").value=d.name;$("#aRoot").value=d.root;check()}catch(e){$("#aPath").textContent=errText(e)}
      $("#aName").addEventListener("input",check);$("#aRoot").addEventListener("input",check);
    }
    if(ws){
      try{await invoke("workspace_sync",{item:S.items.find(x=>x.id===it.id)||it,path:ws.path,force:true});
        const h=await invoke("workspace_handoff",{path:ws.path,record:false});
        $("#aDiff").textContent=h.first?"还没交给过 AI":h.empty?"上次交给 AI 之后笔记没有变化":"自上次交给 AI："+h.summary;setPrompt(h.prompt)}
      catch(e){$("#aDiff").innerHTML=`<span style="color:var(--danger)">${esc(errText(e))}</span>（文件夹可能被移走了，可以取消勾选「作为项目」直接交给 AI）`}
    }
    refresh();
  })();
  setPrompt(st.proj?"":plainPrompt);
  $("#aProj")&&($("#aProj").onchange=e=>{st.proj=e.target.checked;refresh()});
  $("#aTpl")&&($("#aTpl").onchange=()=>{setPrompt(tpl().prompt)});
  $("#aTplEdit")&&($("#aTplEdit").onclick=()=>openTemplates(()=>openAgent(it,promptText)));
  $("#aList").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;pick=+b.dataset.i;root.querySelectorAll(".agent").forEach(x=>x.setAttribute("aria-pressed",x.dataset.i==pick))};
  $("#aCancel").onclick=closeModal;
  $("#aCopy").onclick=async()=>{if(await copyText(P.value))toast("已复制提示词")};
  /** 生成（或同步）项目，返回目录 */
  async function makeProject(){
    if(ws){await invoke("workspace_sync",{item:S.items.find(x=>x.id===it.id)||it,path:ws.path,force:true});return ws.path}
    const name=$("#aName").value.trim(),r=$("#aRoot").value.trim();
    if(!st.check||!["new","ours"].includes(st.check.state))throw "先把项目名和目录填好（下面要显示「新建」）";
    const t=tpl();
    const res=await invoke("workspace_prepare",{item:S.items.find(x=>x.id===it.id)||it,root:r,name,template:t,git:$("#aGit").checked});
    try{localStorage.setItem("wb-wsroot",r)}catch(e){}
    await recordWorkspace(it,res.path,name,t.id,agents[pick]&&agents[pick].name);
    return res.path;
  }
  const mk=$("#aMake");
  if(mk)mk.onclick=async()=>{mk.disabled=true;$("#aErr").textContent="";
    try{const p=await makeProject();closeModal();toast("项目已生成："+p);openTarget(p)}catch(e){$("#aErr").textContent=errText(e);mk.disabled=false}};
  $("#aGo").onclick=async()=>{
    const a=agents[pick];const b=$("#aGo");b.disabled=true;$("#aErr").textContent="";
    try{
      let cwd=$("#aCwd").value.trim();
      if(st.proj){cwd=await makeProject();await invoke("workspace_handoff",{path:cwd,record:true})}
      await invoke("run_agent",{agent:a,cwd,prompt:P.value});
      try{localStorage.setItem("wb-agent",a.name)}catch(e){}
      closeModal();toast("已交给 "+a.name+(st.proj?"，工作目录："+cwd:""));
      const cur=S.items.find(x=>x.id===it.id);
      if(cur)patch(cur,{agentLog:[...(cur.agentLog||[]),{agent:a.name,at:Date.now()}].slice(-10)}).catch(()=>{});
    }catch(e){$("#aErr").textContent=errText(e);b.disabled=false}
  };
}

/* ---- 任务模板 ---- */

  await loadTemplates();let list=JSON.parse(JSON.stringify(S.templates||[]));
  const row=(t,i)=>`<div class="tplrow" data-ti="${i}">
    <div class="row"><input class="t-name" value="${esc(t.name)}" placeholder="模板名"><span class="hint">id：${esc(t.id)}</span><span style="flex:1"></span><button class="btn danger" data-tdel="${i}">删除</button></div>
    <label class="field">目标（写进 TASK.md）<textarea class="t-goal">${esc(t.goal)}</textarea></label>
    <label class="field">开场提示词<textarea class="t-prompt" style="min-height:70px">${esc(t.prompt)}</textarea></label>
    <label class="field">「继续」时追加的提示<textarea class="t-resume" style="min-height:60px">${esc(t.resume)}</textarea></label></div>`;
  const draw=()=>{$("#modalRoot").innerHTML=`<div class="overlay"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="tplT" data-tplmodal>

    <div id="tplList" class="tpllist">${list.map(row).join("")}</div>
    <div class="err" id="tplErr"></div>
    <div class="row"><button class="btn" id="tplAdd">${ico("plus")}新模板</button><button class="btn ghost" id="tplReset" title="恢复内置的四个模板">恢复默认</button><span style="flex:1"></span><button class="btn ghost" id="tplCancel">取消</button><button class="btn primary" id="tplSave">保存</button></div>
  </div></div>`;
    const read=()=>{document.querySelectorAll(".tplrow").forEach(r=>{const t=list[+r.dataset.ti];t.name=r.querySelector(".t-name").value.trim();t.goal=r.querySelector(".t-goal").value;t.prompt=r.querySelector(".t-prompt").value;t.resume=r.querySelector(".t-resume").value})};
    $("#tplAdd").onclick=()=>{read();list.push({id:"t"+Date.now().toString(36),name:"新模板",goal:"",prompt:"请先读 .xpanel/TASK.md 和 .xpanel/note.md。",resume:"在已有工作的基础上继续，只处理新增的内容。"});draw();document.querySelector(".tplrow:last-child .t-name")?.focus()};
    $("#tplList").onclick=e=>{const d=e.target.closest("[data-tdel]");if(!d)return;read();list.splice(+d.dataset.tdel,1);draw()};
    $("#tplReset").onclick=async()=>{try{S.templates=(await v1("PUT","/templates",{templates:[]})).templates;list=JSON.parse(JSON.stringify(S.templates));draw();toast("已恢复默认模板")}catch(x){$("#tplErr").textContent=errText(x)}};
    const done=()=>{closeModal();if(back)back()};
    $("#tplCancel").onclick=done;
    $("#tplSave").onclick=async()=>{read();try{S.templates=(await v1("PUT","/templates",{templates:list})).templates;toast("模板已保存");done()}catch(x){$("#tplErr").textContent=errText(x)}};
  };
  draw();
}

/* ---- 收件箱：追加到笔记 ---- */
function openAppendToNote(it){
  const recent=()=>{try{return JSON.parse(localStorage.getItem("wb-appendto")||"[]")}catch(e){return []}};
  let q="";
  const draw=()=>{
    const rc=recent();const notes=S.items.filter(i=>i.type==="note"&&(!q||(noteTitle(i)+"\n"+(i.body||"")).toLowerCase().includes(q.toLowerCase())))
      .sort((a,b)=>{const ia=rc.indexOf(a.id),ib=rc.indexOf(b.id);return (ia<0?99:ia)-(ib<0?99:ib)||byRecent(a,b)}).slice(0,30);
    $("#apList").innerHTML=notes.map(n=>`<button class="apitem" data-ap="${esc(n.id)}"><b>${esc(noteTitle(n))}</b><span>${rc.includes(n.id)?"最近用过 · ":""}${esc(n.category||"")} ${ago(n.updatedAt)}</span></button>`).join("")||`<div class="empty">没有找到笔记</div>`;
  };
  $("#modalRoot").innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="apT">
    <h2 id="apT">追加到笔记</h2><p>这条内容（文字和截图）会接在所选笔记的末尾，然后从收件箱移走。</p>
    <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="apQ" type="search" placeholder="找笔记" aria-label="找笔记"></label>
    <div class="aplist" id="apList"></div>
    <div class="row"><span style="flex:1"></span><button class="btn ghost" id="apCancel">取消</button></div></div></div>`;
  draw();$("#apQ").focus();
  $("#apQ").oninput=e=>{q=e.target.value.trim();draw()};
  $("#apCancel").onclick=closeModal;
  $("#apList").onclick=async e=>{const b=e.target.closest("[data-ap]");if(!b)return;const n=S.items.find(x=>x.id===b.dataset.ap);if(!n)return;
    const title=INBOX_AUTO.test(it.title||"")&&it.body?"":it.title;
    const add=[title,it.body].filter(Boolean).join("\n\n");
    closeModal();
    try{await patch(n,{body:[(n.body||"").trimEnd(),add].filter(Boolean).join("\n\n")});await removeItem(it.id);
      try{const rc=recent().filter(x=>x!==n.id);rc.unshift(n.id);localStorage.setItem("wb-appendto",JSON.stringify(rc.slice(0,8)))}catch(x){}
      toast(`已追加到「${noteTitle(n)}」`)}catch(x){}
  };
}

/* ================= 划词问 AI：问答挂在原文旁边 =================
   阅读笔记时选中一段 → 「问 AI」→ 本机的 Claude Code / Codex 不开窗口回答（claude -p）。
   问答存在条目的 qa 字段：{id, quote, prefix, suffix, at, turns:[{q, a, at, by}]}。
   位置记「原话 + 前后文」而不是字符位置，笔记后来插了内容也能找回；找不到时标「原文已删改」。 */
S.qaPending={};
const QA_CTX=40;
/** 容器里参与定位的文字节点（跳过图片工具条、问答区） */
function hostTextNodes(root){
  const out=[];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest(".imgtools,.qasec,.qa-skip")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;while((n=w.nextNode()))out.push(n);return out;
}
const hostText=root=>hostTextNodes(root).map(n=>n.nodeValue).join("");
/** 选区在容器文字里的起止位置 */
function selOffsets(root,range){
  let pos=0,start=-1,end=-1;
  for(const n of hostTextNodes(root)){
    const len=n.nodeValue.length;
    if(n===range.startContainer)start=pos+range.startOffset;
    if(n===range.endContainer)end=pos+range.endOffset;
    pos+=len;
  }
  return start>=0&&end>start?[start,end]:null;
}
function commonTail(a,b){let i=0;while(i<a.length&&i<b.length&&a[a.length-1-i]===b[b.length-1-i])i++;return i}
function commonHead(a,b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i}
/** 在文字里找到这条问答的原文，返回起点（找不到 -1） */
function locateQuote(text,q){
  if(!q.quote)return -1;
  const hits=[];let i=-1;while((i=text.indexOf(q.quote,i+1))>=0)hits.push(i);
  if(!hits.length)return -1;
  let best=hits[0],score=-1;
  for(const h of hits){const s=commonTail(text.slice(Math.max(0,h-QA_CTX),h),q.prefix||"")+commonHead(text.slice(h+q.quote.length,h+q.quote.length+QA_CTX),q.suffix||"");if(s>score){score=s;best=h}}
  return best;
}
/** 给原文加高亮（可能跨好几个文字节点） */
function markRange(root,start,end,id){
  let pos=0;
  for(const n of hostTextNodes(root)){
    const len=n.nodeValue.length,a=Math.max(start,pos),b=Math.min(end,pos+len);
    if(a<b){const r=document.createRange();r.setStart(n,a-pos);r.setEnd(n,b-pos);const m=document.createElement("mark");m.className="qa-mark";m.dataset.qa=id;try{r.surroundContents(m)}catch(e){}}
    pos+=len;if(pos>=end)break;
  }
}
/** 把条目上所有问答的原文标出来；返回找不到原文的问答 id */
function markQuotes(root,it){
  const lost=new Set();
  for(const q of it.qa||[]){if(!q.quote)continue;const text=hostText(root);const s=locateQuote(text,q);if(s<0){lost.add(q.id);continue}markRange(root,s,s+q.quote.length,q.id)}
  return lost;
}
function qaSectionHTML(it,lost){
  const list=it.qa||[],pend=S.qaPending[it.id]||[];
  if(!list.length&&!pend.length)return `<section class="qasec qa-empty"><div class="hint">选中笔记里的一段文字就能「问 AI」，问答会挂在原文旁边。<button class="btn ghost" data-qa-new>${ico("ai")}针对整篇提问</button></div></section>`;
  const turn=t=>`<div class="qa-t"><div class="qa-ask">${esc(t.q)}</div><div class="md">${mdHTML(t.a)}</div><div class="qa-meta">${esc(t.by||"")} · ${esc(new Date(t.at).toLocaleString())}</div></div>`;
  return `<section class="qasec"><h3>${ico("ai")} 问答 <span class="n">${list.length}</span><span class="grow"></span>
      <button class="btn ghost" data-qa-new title="不针对某一段，问整篇">${ico("plus")}提问</button>
      ${list.length?`<button class="btn ghost" data-qa-digest title="把这些问答按原文顺序整理成一篇新笔记">${ico("note")}整理成笔记</button>`:""}</h3>
    ${pend.map(p=>`<div class="qa pending"><blockquote>${esc(p.quote||"整篇笔记")}</blockquote><div class="qa-ask">${esc(p.q)}</div><div class="hint"><span class="spin"></span> 正在问 ${esc(p.agent)}…</div></div>`).join("")}
    ${list.slice().reverse().map(q=>`<div class="qa" data-qa-card="${esc(q.id)}">
      <blockquote data-qa-jump="${esc(q.id)}" title="${q.quote?"定位到原文":""}">${esc(q.quote||"整篇笔记")}${lost&&lost.has(q.id)?` <span class="lost">原文已删改</span>`:""}</blockquote>
      ${(q.turns||[]).map(turn).join("")}
      <div class="qa-act"><button class="btn ghost" data-qa-follow="${esc(q.id)}">追问</button><button class="btn ghost" data-qa-copy="${esc(q.id)}">复制</button><span class="grow"></span><button class="btn danger" data-qa-del="${esc(q.id)}">删除</button></div></div>`).join("")}
  </section>`;
}
/** 在阅读区（.qa-host）后面挂上问答，并标出原文 */
function attachQA(host,it){
  if(!host)return;
  const old=host.parentElement.querySelector(":scope > .qasec");if(old)old.remove();
  host.dataset.qaItem=it.id;
  const lost=markQuotes(host,it);
  host.insertAdjacentHTML("afterend",qaSectionHTML(it,lost));
  const sec=host.parentElement.querySelector(":scope > .qasec");sec.dataset.qaItem=it.id;hydrate(sec);
}

/* ---- 选中文字 → 浮出「问 AI」 ---- */
let qaSel=null;
const qaBtn=document.createElement("button");qaBtn.className="qa-float";qaBtn.innerHTML=`${ico("ai")}问 AI`;qaBtn.hidden=true;document.body.appendChild(qaBtn);
document.addEventListener("mouseup",e=>{
  if(e.target.closest&&e.target.closest(".qa-float"))return;
  setTimeout(()=>{
    const sel=window.getSelection();qaBtn.hidden=true;qaSel=null;
    if(!sel||sel.isCollapsed||!sel.rangeCount)return;
    const r=sel.getRangeAt(0);const host=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer.closest(".qa-host"):r.commonAncestorContainer.parentElement&&r.commonAncestorContainer.parentElement.closest(".qa-host");
    if(!host||!host.dataset.qaItem)return;
    const off=selOffsets(host,r);if(!off)return;
    const text=hostText(host);const quote=text.slice(off[0],off[1]).trim();if(!quote||quote.length>1500)return;
    const s=off[0]+text.slice(off[0],off[1]).indexOf(quote);
    qaSel={itemId:host.dataset.qaItem,quote,prefix:text.slice(Math.max(0,s-QA_CTX),s),suffix:text.slice(s+quote.length,s+quote.length+QA_CTX)};
    const rect=r.getBoundingClientRect();qaBtn.style.left=Math.min(window.innerWidth-110,rect.right+window.scrollX-40)+"px";qaBtn.style.top=(rect.bottom+window.scrollY+6)+"px";qaBtn.hidden=false;
  },0);
});
document.addEventListener("mousedown",e=>{if(!e.target.closest||!e.target.closest(".qa-float"))qaBtn.hidden=true});
qaBtn.addEventListener("mousedown",e=>e.preventDefault()); // 别让选区消失
qaBtn.onclick=()=>{qaBtn.hidden=true;if(qaSel)openAsk(qaSel)};

/* ---- 提问 ---- */
function askAgents(){return ((S.cfg&&S.cfg.agents)||[]).filter(a=>(a.ask||"").trim()||/^(claude|codex)(\.exe|\.cmd)?\b/i.test(String(a.cmd||"").trim().split(/[\\/]/).pop()))}
function buildAskPrompt(it,ctx,question,prev){
  const body=String(it.body||"").replace(/!\[[^\]]*\]\(asset:[^)]+\)/g,"[图片]");
  const L=[`你在帮我读一篇笔记，回答我关于它的问题。`,``,`笔记标题：${it.title||"(无标题)"}`];
  if(ctx.quote)L.push(``,`我选中的原文：`,...ctx.quote.split("\n").map(l=>"> "+l),``,`（前后文：…${ctx.prefix||""}【${ctx.quote}】${ctx.suffix||""}…）`);
  L.push(``,`笔记全文：`,"```markdown",body.length>12000?body.slice(0,12000)+"\n…（后面省略）":body,"```");
  if(prev&&prev.length){L.push(``,`之前关于这段的问答：`);prev.forEach(t=>L.push(`问：${t.q}`,`答：${t.a}`,``))}
  L.push(``,`我的问题：${question}`,``,`请用中文直接回答，Markdown 格式，准确、简洁，先给结论再解释；不确定的地方直说。不要修改任何文件。`);
  return L.join("\n");
}
function openAsk(ctx,followId){
  const it=S.items.find(x=>x.id===ctx.itemId);if(!it)return;
  const q0=followId?(it.qa||[]).find(q=>q.id===followId):null;
  const agents=askAgents();let pick=0;try{const i=agents.findIndex(a=>a.name===localStorage.getItem("wb-askagent"));if(i>=0)pick=i}catch(e){}
  const quote=q0?q0.quote:ctx.quote;
  $("#modalRoot").innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="askT">
    <h2 id="askT">${q0?"追问":"问 AI"}</h2>
    <blockquote class="askq">${esc(quote||"针对整篇笔记「"+(it.title||"")+"」")}</blockquote>
    ${q0?(q0.turns||[]).map(t=>`<div class="qa-t"><div class="qa-ask">${esc(t.q)}</div><div class="md">${mdHTML(t.a)}</div></div>`).join(""):""}
    <label class="field">问题<textarea id="askQ" style="min-height:90px" placeholder="比如：这里说的分层分别负责什么？和我们项目的对应关系是？">${esc(ctx.draft||"")}</textarea></label>
    ${IS_APP?(agents.length?`<div class="agents" id="askAgents">${agents.map((a,i)=>`<button class="agent" data-i="${i}" aria-pressed="${i===pick}">${ico("ai")}${esc(a.name)}</button>`).join("")}</div>
      <p>${myWorkspace(it)?"会在这条笔记的项目目录里提问，AI 能看到里面的截图和材料。":"不开窗口，在后台问，答完自动挂到原文旁边。"}</p>`
      :`<p class="err">还没有能直接问答的 AI。去「设置」给 AI 填一个问答命令（比如 claude -p）。</p>`)
    :`<p>网页版不能直接调用本机的 AI：先「复制提问」发给任意 AI，再把回答粘到下面。</p><label class="field">回答<textarea id="askA" style="min-height:120px" placeholder="把 AI 的回答粘贴到这里"></textarea></label>`}
    <div class="err" id="askErr">${esc(ctx.error||"")}</div>
    <div class="row">${IS_APP?`<button class="btn primary" id="askGo" ${agents.length?"":"disabled"}>${ico("ai")}提问</button>`:`<button class="btn primary" id="askSave">保存问答</button>`}
      <button class="btn ghost" id="askCancel">取消</button><span style="flex:1"></span><button class="btn" id="askCopy">${ico("copy")}复制提问</button></div>
  </div></div>`;
  const Q=$("#askQ");Q.focus();
  const prev=q0?q0.turns:null;
  $("#askAgents")&&($("#askAgents").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;pick=+b.dataset.i;document.querySelectorAll("#askAgents .agent").forEach(x=>x.setAttribute("aria-pressed",x.dataset.i==pick))});
  $("#askCancel").onclick=closeModal;
  $("#askCopy").onclick=async()=>{const q=Q.value.trim();if(!q){Q.focus();return}toast(await copyText(buildAskPrompt(it,{...ctx,quote},q,prev))?"已复制，发给任意 AI 即可":"复制失败")};
  Q.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){($("#askGo")||$("#askSave")).click()}});
  const save=async(q,a,by)=>{
    const cur=S.items.find(x=>x.id===it.id)||it;const list=(cur.qa||[]).slice();const turn={q,a,at:Date.now(),by};
    if(followId){const i=list.findIndex(x=>x.id===followId);if(i>=0)list[i]={...list[i],turns:[...(list[i].turns||[]),turn]}}
    else list.push({id:newId(),quote:ctx.quote||"",prefix:ctx.prefix||"",suffix:ctx.suffix||"",at:Date.now(),turns:[turn]});
    await patch(cur,{qa:list});
  };
  $("#askSave")&&($("#askSave").onclick=async()=>{const q=Q.value.trim(),a=$("#askA").value.trim();if(!q||!a){$("#askErr").textContent="问题和回答都要填";return}closeModal();await save(q,a,"手动").catch(()=>{});toast("问答已保存")});
  $("#askGo")&&($("#askGo").onclick=async()=>{
    const q=Q.value.trim();if(!q){Q.focus();return}
    const a=agents[pick];try{localStorage.setItem("wb-askagent",a.name)}catch(e){}
    closeModal();window.getSelection()?.removeAllRanges();
    const p={q,quote,agent:a.name};(S.qaPending[it.id]=S.qaPending[it.id]||[]).push(p);S.sideKey=null;forceRender();
    try{
      const w=myWorkspace(it);
      const ans=await invoke("ask_ai",{agent:a,cwd:w?w.path:"",prompt:buildAskPrompt(it,{...ctx,quote},q,prev)});
      S.qaPending[it.id]=(S.qaPending[it.id]||[]).filter(x=>x!==p);
      await save(q,String(ans).trim(),a.name);toast(`${a.name} 回答了，已挂在原文旁边`);
    }catch(e){
      S.qaPending[it.id]=(S.qaPending[it.id]||[]).filter(x=>x!==p);S.sideKey=null;forceRender();
      openAsk({...ctx,draft:q,error:"没问成："+errText(e)},followId);
    }
  });
}

/* ---- 问答区的按钮、原文和问答互相定位 ---- */
function flash(el){if(!el)return;el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}
document.addEventListener("click",async e=>{
  const sec=e.target.closest&&e.target.closest(".qasec");
  const mk=e.target.closest&&e.target.closest("mark.qa-mark");
  if(mk){const root=mk.closest(".qa-host").parentElement;flash(root.querySelector(`[data-qa-card="${CSS.escape(mk.dataset.qa)}"]`));return}
  if(!sec)return;
  const it=S.items.find(x=>x.id===sec.dataset.qaItem);if(!it)return;
  const b=e.target.closest("button,[data-qa-jump]");if(!b)return;
  if(b.hasAttribute("data-qa-new")){openAsk({itemId:it.id,quote:"",prefix:"",suffix:""});return}
  if(b.dataset.qaJump){const host=sec.parentElement.querySelector(":scope > .qa-host");flash(host&&host.querySelector(`mark.qa-mark[data-qa="${CSS.escape(b.dataset.qaJump)}"]`));return}
  if(b.dataset.qaFollow){const q=(it.qa||[]).find(x=>x.id===b.dataset.qaFollow);if(q)openAsk({itemId:it.id,quote:q.quote,prefix:q.prefix,suffix:q.suffix},q.id);return}
  if(b.dataset.qaCopy){const q=(it.qa||[]).find(x=>x.id===b.dataset.qaCopy);if(q)toast(await copyText([q.quote?"> "+q.quote.replace(/\n/g,"\n> "):"",...(q.turns||[]).map(t=>`**问：** ${t.q}\n\n${t.a}`)].filter(Boolean).join("\n\n"))?"已复制":"复制失败");return}
  if(b.dataset.qaDel){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="再点一次删除";return}await patch(it,{qa:(it.qa||[]).filter(x=>x.id!==b.dataset.qaDel)}).catch(()=>{});return}
  if(b.hasAttribute("data-qa-digest")){
    const host=sec.parentElement.querySelector(":scope > .qa-host");const text=host?hostText(host):"";
    const list=(it.qa||[]).map(q=>({q,pos:q.quote?locateQuote(text,q):-1})).sort((a,b)=>(a.pos<0?1e9:a.pos)-(b.pos<0?1e9:b.pos)||a.q.at-b.q.at);
    const md=[`> 笔记「${it.title||""}」的问答整理，共 ${list.length} 条。`,...list.map(({q},i)=>{const [t0,...rest]=q.turns||[];
      return [`## ${i+1}. ${t0?t0.q:""}`,q.quote?q.quote.split("\n").map(l=>"> "+l).join("\n"):"> （针对整篇）",t0?t0.a:"",...rest.map(t=>`**追问：** ${t.q}\n\n${t.a}`)].join("\n\n")})].join("\n\n");
    const id=await addItem({type:"note",title:`${it.title||"笔记"} · 问答`,body:md,category:it.category||"",tags:[...(it.tags||[])]}).catch(()=>null);
    if(id){openSide(id);toast("已整理成一篇新笔记")}
  }
});

/* ================= 启动 ================= */
renderCapTypes();forceRender();
(async()=>{
  if(IS_APP&&!window.__WB_OVERRIDE){
    try{const r=await invoke("get_config");S.cfg=r.config;S.lan=r.lan;S.hostname=r.hostname}catch(e){}
    if(S.cfg&&S.cfg.mode){const h=await fetchNewerUI();if(h){swapUI(h);return}}
  }
  if(IS_APP){
    if(!S.cfg){try{const r=await invoke("get_config");S.cfg=r.config;S.lan=r.lan;S.hostname=r.hostname}catch(e){}}
    if(!S.cfg||!S.cfg.mode){S.conn={state:"warn",text:"还没设置"};renderStatus();openSettings(true);return}
  }
  await load();
  // 桌面版还没选“这台电脑是哪台设备”：打开设备页提示一次
  if(IS_APP&&S.cfg&&S.cfg.mode&&!thisDevId())openDevices();
})();
const timers=[setInterval(()=>{if(window.__WB_STOP)return timers.forEach(clearInterval);poll()},3000),
  setInterval(()=>{if(!window.__WB_STOP)checkUIUpdate()},90000)];
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!window.__WB_STOP)poll()});
window.__wb={insertFile,S};
})();
