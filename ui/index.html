<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="wb-ui-version" content="15">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的工作台</title>
<script>try{var t=localStorage.getItem("wb-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Layout: full width. Top = greeting + tabs. Tab「事项」: focus strip → three lanes. Tab「入口」: entry points grouped by machine. Right rail = rules + connection status. */
:root{
  --bg:#F3F4F7; --bg-glow:#E6EEF6; --surface:#FFFFFF; --surface-2:#F7F8FA; --fg:#1C2130; --muted:#6D7386; --faint:#A3A8B7; --line:#E3E6EC;
  --accent:#0F7A6C; --accent-soft:#E2F2EE; --accent-fg:#FFFFFF;
  --todo:#3563D1; --todo-soft:#E8EEFB; --issue:#D9503F; --issue-soft:#FBEAE7; --idea:#C98712; --idea-soft:#FBF1DC;
  --rule:#6E54D8; --rule-soft:#EEEAFB; --link:#138C92; --link-soft:#E0F2F3; --note:#4A5E80; --note-soft:#E8EDF5; --warn:#B7791F; --warn-soft:#FDF3E1;
  --danger:#C0352B; --shadow:0 1px 2px rgba(28,33,48,.05),0 2px 8px rgba(28,33,48,.04); --shadow-h:0 2px 4px rgba(28,33,48,.06),0 8px 20px rgba(28,33,48,.07);
  --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --num:"Segoe UI Variable Display","Segoe UI","SF Pro Display",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,Menlo,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141A; --bg-glow:#172029; --surface:#1B1E26; --surface-2:#20242D; --fg:#E7E9EF; --muted:#9398A8; --faint:#646A7B; --line:#2A2F3A;
  --accent:#4CC2A8; --accent-soft:#193430; --accent-fg:#0D1512;
  --todo:#7C9CF0; --todo-soft:#1E2640; --issue:#F08576; --issue-soft:#3A2226; --idea:#EBB54F; --idea-soft:#36301C;
  --rule:#A794F4; --rule-soft:#2A2542; --link:#5ECDD2; --link-soft:#18333A; --note:#A3B6D6; --note-soft:#232B3A; --warn:#EBB54F; --warn-soft:#36301C;
  --danger:#F28B82; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-h:0 4px 16px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141A; --bg-glow:#172029; --surface:#1B1E26; --surface-2:#20242D; --fg:#E7E9EF; --muted:#9398A8; --faint:#646A7B; --line:#2A2F3A;
  --accent:#4CC2A8; --accent-soft:#193430; --accent-fg:#0D1512;
  --todo:#7C9CF0; --todo-soft:#1E2640; --issue:#F08576; --issue-soft:#3A2226; --idea:#EBB54F; --idea-soft:#36301C;
  --rule:#A794F4; --rule-soft:#2A2542; --link:#5ECDD2; --link-soft:#18333A; --note:#A3B6D6; --note-soft:#232B3A; --warn:#EBB54F; --warn-soft:#36301C;
  --danger:#F28B82; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-h:0 4px 16px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(1200px 380px at 12% -80px,var(--bg-glow),transparent 70%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;padding:26px 32px 48px}
@media (max-width:1100px){.shell{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.shell{padding:18px 16px 36px;gap:20px}}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.rail{min-width:0;display:flex;flex-direction:column;gap:18px}

/* header */
.hello{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hello .date{font-size:13px;color:var(--muted);letter-spacing:.04em}
.hello h1{margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hello .grow{flex:1}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:8px 14px 8px 10px;box-shadow:var(--shadow);border:none;cursor:pointer;text-align:left}
.pill:hover{box-shadow:var(--shadow-h)}
.pill .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--c)}
.pill b{font-family:var(--num);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;display:block}
.pill span{font-size:12px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:400;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;box-shadow:var(--shadow);border:none;cursor:pointer}
.themebtn{padding:4px 8px;color:var(--muted)}.themebtn .i{width:14px;height:14px}.themebtn:hover{color:var(--accent)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok i{background:var(--accent)} .status.warn i{background:var(--warn)} .status.bad i{background:var(--danger)}

.banner{display:flex;gap:12px;align-items:center;background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13px;flex-wrap:wrap}
.banner b{color:var(--warn)}
.banner .grow{flex:1;min-width:200px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;padding:8px 14px 10px;cursor:pointer;color:var(--muted);font-size:15px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px}
.tab .n:empty{display:none}
.tab .n{font-family:var(--num);font-size:12px;background:var(--surface-2);border-radius:999px;padding:0 7px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}

/* capture */
.capture{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;border:1px solid transparent;transition:border-color .15s,box-shadow .15s}
.capture:focus-within{border-color:var(--accent);box-shadow:var(--shadow-h)}
.cap-row{display:flex;gap:12px;align-items:flex-start}
#cap{flex:1;min-width:0;resize:none;border:none;background:transparent;outline:none;font-size:16px;line-height:1.55;padding:6px 0;min-height:34px}
#cap::placeholder{color:var(--faint)}
.cap-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;border-radius:8px;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button .i{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--c,var(--fg));box-shadow:var(--shadow);font-weight:500}
.hint{font-size:12px;color:var(--faint)}
.capture.drop,.ed textarea.drop,.nedit.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.cap-files{display:flex;gap:8px;flex-wrap:wrap}
.cap-files:empty{display:none}
.cap-file{position:relative;width:88px;height:62px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.cap-file img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.cap-file .fname{display:block;padding:6px;font-size:11px;color:var(--muted);overflow:hidden;overflow-wrap:anywhere}
.cap-file.up::after{content:"保存中…";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--fg);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.cap-file button{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:18px;padding:0;cursor:pointer}
.thumbs{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap;align-items:center;align-self:stretch;width:100%}
.thumbs img{height:56px;max-width:128px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.thumbs .more-n{font-size:12px;color:var(--muted)}
.card{flex-wrap:wrap}
.card>.thumbs{flex-basis:100%;margin:0 0 2px 28px;width:auto}
.nprev img{max-height:420px;width:auto}
.imgbox{position:relative;display:inline-block;max-width:100%;vertical-align:top}
.imgbox img{margin:0}
.imgbox.sized img{max-height:none}
.imgtools{position:absolute;top:8px;right:8px;display:none;gap:2px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:var(--shadow)}
.imgbox:hover .imgtools,.imgbox.resizing .imgtools{display:flex}
.imgtools button{border:none;background:transparent;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);cursor:pointer}
.imgtools button:hover,.imgtools button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.imghandle{position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:nwse-resize;display:none;touch-action:none}
.imgbox:hover .imghandle,.imgbox.resizing .imghandle{display:block}
.notes.withnav{grid-template-columns:210px 290px minmax(0,1fr)}
@media (max-width:1250px){.notes.withnav{grid-template-columns:290px minmax(0,1fr)}.notes.withnav .nnav{display:none}}
.nnav{display:flex;flex-direction:column;gap:2px;overflow:auto;min-width:0;padding:2px 2px 12px}
.nnav-h{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--faint);margin:12px 6px 4px;letter-spacing:.02em}
.nnav-h .grow{flex:1}
.nnav-h button{border:none;background:transparent;color:var(--faint);cursor:pointer;border-radius:6px;padding:2px 4px;display:inline-flex}
.nnav-h button:hover{color:var(--accent);background:var(--surface-2)}
.cnode{display:flex;align-items:center;gap:4px;border:none;background:transparent;border-radius:8px;padding:5px 8px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--fg);min-width:0;width:100%}
.cnode:hover{background:var(--surface-2)}
.cnode[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cnode .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnode .n{font-size:11.5px;color:var(--faint);font-weight:400}
.cnode .tw{width:14px;flex:none;display:inline-flex;justify-content:center;color:var(--faint);font-size:10px}
.tagcloud{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px}
.tagcloud button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted);cursor:pointer}
.tagcloud button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tagcloud button .n{color:var(--faint);margin-left:3px}
.tagcloud button[aria-pressed="true"] .n{color:inherit;opacity:.8}
#catFilter{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;max-width:220px;color:var(--fg)}
.nmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.nmeta input{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;font-size:12.5px;outline:none;min-width:0}
.nmeta input:hover,.nmeta input:focus{border-color:var(--line);background:var(--surface-2)}
.nmeta .ncat{width:190px}
.nmeta .ntag{width:110px}
.tagchip{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:6px;padding:1px 4px 1px 7px;color:var(--muted)}
.tagchip button{border:none;background:transparent;color:var(--faint);cursor:pointer;padding:0 3px;font-size:12px}
.tagchip button:hover{color:var(--danger,#c0392b)}
.pri{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:1px;line-height:17px}
.pri.P0{background:#FDE7E7;color:#C62828}.pri.P1{background:#FFF0DD;color:#B45309}.pri.P2{background:#E4EEFF;color:#1D4ED8}.pri.P3{background:var(--surface-2);color:var(--muted)}
:root[data-theme="dark"] .pri.P0{background:#3B1D1D;color:#FF9C9C}:root[data-theme="dark"] .pri.P1{background:#3A2A14;color:#FBBF6B}:root[data-theme="dark"] .pri.P2{background:#1B2A45;color:#93B8FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri.P0{background:#3B1D1D;color:#FF9C9C}:root:not([data-theme="light"]) .pri.P1{background:#3A2A14;color:#FBBF6B}:root:not([data-theme="light"]) .pri.P2{background:#1B2A45;color:#93B8FF}}
.due{color:var(--muted)}
.due.soon{color:#B45309;font-weight:600}
.due.late{color:#C62828;font-weight:600}
.catchip{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:0;font-size:inherit}
.catchip:hover{color:var(--accent);text-decoration:underline}
.ed .row.more{flex-wrap:wrap}
.ed .e-pri{flex:1 1 110px}
.ed .e-due{flex:1 1 140px;min-width:130px}
.ed .e-cat{flex:1 1 160px}
.duebtns{display:inline-flex;gap:2px;flex:none}
.duebtns button{white-space:nowrap;border:none;background:var(--surface-2);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted);cursor:pointer}
.duebtns button:hover{color:var(--accent)}
.cmgr{display:flex;flex-direction:column;gap:2px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:5px 8px;border-radius:8px}
.crow:hover{background:var(--surface-2)}
.crow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .n{font-size:12px;color:var(--faint)}
.crow .ops{display:flex;gap:4px}
.crow input{border:1px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:13px;width:100%;outline:none;background:var(--surface-2)}
.cnew{display:flex;gap:8px}
.cnew input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface-2);outline:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:1000;cursor:zoom-out}
.devdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.devdot.on{background:#2FA66A;box-shadow:0 0 0 3px color-mix(in srgb,#2FA66A 20%,transparent)}
.dlist{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.drow:hover{background:var(--surface-2)}
.drow .ip{font-family:var(--mono);font-size:12px;color:var(--muted)}
.drow .me,.dcard .me{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;margin-left:6px}
.modal.wide{width:min(900px,100%)}
.devs{display:flex;flex-direction:column;gap:10px}
.dcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dev-h{display:flex;align-items:center;gap:8px}
.dev-h b{font-size:15px}
.dev-h .grow,.modal .row .grow{flex:1}
.dev-h .kind{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 7px}
.dcard .desc{font-size:13px;color:var(--muted);white-space:pre-wrap}
.dcard .kv{grid-template-columns:88px minmax(0,1fr)}
.dcard .rows{display:flex;flex-direction:column;gap:6px}
.dcard .rowed{display:grid;gap:6px;grid-template-columns:140px 160px minmax(0,1fr) auto}
.dcard .rowed.proj{grid-template-columns:140px minmax(0,1.4fr) 140px minmax(0,1fr) auto}
.dcard input,.dcard select,.dcard textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0;font-size:13px;outline:none;width:100%}
.dcard input:focus,.dcard select:focus,.dcard textarea:focus{border-color:var(--accent)}
.dcard textarea{min-height:0;height:auto;resize:vertical;font-family:inherit}
.dcard .grid2{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:8px}
.claim{border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.claim select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px}
@media (max-width:700px){.dcard .rowed,.dcard .rowed.proj,.dcard .grid2{grid-template-columns:minmax(0,1fr)}}
.lightbox img{max-width:94vw;max-height:92vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.btn{border:none;background:var(--surface-2);border-radius:10px;padding:7px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.danger{background:transparent;color:var(--danger)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}

/* section titles */
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sec-h h2{margin:0;font-size:15px;font-weight:700}
.sec-h .n{font-family:var(--num);font-weight:700;font-size:12px;color:var(--c);background:var(--soft);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.sec-h .badge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--c)}
.sec-h .grow{flex:1}
.sec-h .add{border:none;background:transparent;color:var(--faint);cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sec-h .add:hover{background:var(--soft);color:var(--c)}

/* focus strip */
.focus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.fcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.fcard .kind{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--c);font-weight:500}
.fcard .kind .i{width:13px;height:13px}
.fcard .t{font-size:15.5px;font-weight:700;line-height:1.4}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:6px 12px;box-shadow:var(--shadow);width:300px;max-width:100%;color:var(--faint)}
.search input{border:none;outline:none;background:transparent;flex:1;min-width:0;color:var(--fg)}
.chip-on{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:none;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.toolbar .grow{flex:1}
label.toggle{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}

/* lanes */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:900px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{min-width:0;background:color-mix(in srgb,var(--soft) 45%,transparent);border-radius:16px;padding:14px 12px 12px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-h)}
.card.done{opacity:.55}
.card.done .t{text-decoration:line-through}
.chk{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--c);border-radius:6px;margin:2px 0 0;cursor:pointer;flex:none;display:grid;place-items:center;background:transparent}
.chk:checked{background:var(--c)}
.chk:checked::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translate(0,-1px) rotate(45deg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:8px;flex:none}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t{font-weight:500;cursor:pointer;overflow-wrap:anywhere;line-height:1.45}
.b{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b.open{display:block}
.b a{color:var(--link)}
.b code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:4px;color:var(--fg)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--faint)}
.tag{color:var(--muted);background:transparent;border:none;padding:0;cursor:pointer;font:inherit}
.tag:hover{color:var(--accent)}
.dev{color:var(--muted);background:var(--surface-2);border-radius:4px;padding:0 6px}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.card:hover .acts,.card:focus-within .acts,.fcard:hover .acts,.fcard:focus-within .acts,.entry:hover .acts,.entry:focus-within .acts,.ritem:hover .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.ic{border:none;background:none;cursor:pointer;color:var(--faint);width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.ic:hover{color:var(--fg);background:var(--surface-2)} .ic.on{color:var(--c)}
.ic .i{width:14px;height:14px}
.fcard .acts{position:absolute;top:10px;right:10px}
.empty{color:var(--faint);font-size:13px;padding:18px 8px;text-align:center}
.more{border:none;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:6px 4px 0;display:inline-flex;gap:4px;align-items:center}
.more:hover{color:var(--fg)}

/* entries (入口) */
.hosts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.host{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 8px;min-width:0}
.host-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.host-h .badge{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--c)}
.host-h h3{margin:0;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.host-h .sub{font-size:12px;color:var(--faint)}
.host-h .grow{flex:1;min-width:0}
.entry{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);min-width:0;border-radius:8px}
.entry:first-of-type{border-top:none}
.entry:hover{background:var(--surface-2)}
.entry .cbody{gap:0}
.entry .t{font-weight:500}
.entry .tgt{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;border:none;cursor:pointer;color:var(--c);height:28px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;background:var(--soft);font-size:12.5px;font-weight:500;text-decoration:none}
.go:hover{filter:brightness(.96)}
.go .i{width:14px;height:14px}

/* rail */
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.rlist{display:flex;flex-direction:column}
.ritem{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.ritem:first-child{border-top:none;padding-top:2px}
.ritem .cbody{gap:2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;overflow-wrap:anywhere}
.kv code{font-family:var(--mono);font-size:12px}

/* editor */
.ed{display:flex;flex-direction:column;gap:8px;width:100%}
.ed input,.ed textarea,.ed select,.field input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;width:100%;min-width:0;outline:none}
.ed input:focus,.ed textarea:focus,.ed select:focus,.field input:focus{border-color:var(--accent)}
.ed .e-title{font-weight:500}
.ed textarea{min-height:96px;resize:vertical;font-size:13px}
.ed .row{display:flex;gap:6px;flex-wrap:wrap}
.ed .row>*{flex:1 1 110px}
.ed .btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ed .btns .grow{flex:1}
.card.editing,.host .editing{box-shadow:var(--shadow-h);outline:1.5px solid var(--c);border-radius:12px;padding:10px}

/* modal / setup */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-h);width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-size:19px}
.modal p{margin:0;color:var(--muted);font-size:13px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.choice{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--surface)}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice h3{margin:0;font-size:15px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input{font-family:var(--mono);font-size:13px;color:var(--fg)}
.modal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px}

.agents{display:flex;gap:8px;flex-wrap:wrap}
.agent{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.agent[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.modal textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-height:180px;resize:vertical;font-size:13px;line-height:1.6;outline:none}
.modal textarea:focus{border-color:var(--accent)}
.agent-rows{display:flex;flex-direction:column;gap:6px}
.agent-row{display:grid;grid-template-columns:140px minmax(0,1fr) 150px auto;gap:6px}
.agent-row input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0;font-size:13px;outline:none}
.agent-row input.cmd{font-family:var(--mono)}
.ailog{color:var(--accent)}
/* markdown */
.md{font-size:13.5px;color:var(--fg);line-height:1.7;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .45em;line-height:1.35;font-weight:700}
.md h1{font-size:1.55em}.md h2{font-size:1.3em;padding-bottom:.25em;border-bottom:1px solid var(--line)}.md h3{font-size:1.12em}.md h4{font-size:1em}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table{margin:.55em 0}
.md ul,.md ol{padding-left:1.5em}.md li{margin:.15em 0}
.md li input[type=checkbox]{margin:0 .4em 0 -1.3em;accent-color:var(--accent)}
.md code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:.1em .35em;border-radius:4px}
.md pre{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.md blockquote{border-left:3px solid var(--line);padding:.1em 0 .1em 12px;color:var(--muted)}
.md a{color:var(--link)}
.md img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:.4em 0}
.md hr{border:none;border-top:1px solid var(--line);margin:1em 0}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left}.md th{background:var(--surface-2)}
.b.md{color:var(--muted);font-size:13px;white-space:normal;display:block;max-height:4.9em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.card .b.md,.fcard .b.md{cursor:pointer}
.b.md.open{max-height:460px;overflow:auto;-webkit-mask-image:none}
.b.md h1,.b.md h2,.b.md h3{font-size:1.05em;border:none;margin:.4em 0 .2em}
.b.md img{max-height:220px;width:auto}
.b.md:not(.open) img{display:none}
.md img{cursor:zoom-in}

/* notes */
.notes{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;height:calc(100vh - 290px);min-height:520px}
@media (max-width:900px){.notes{grid-template-columns:minmax(0,1fr);height:auto}.nlist{max-height:320px}}
.nlist{display:flex;flex-direction:column;gap:6px;overflow:auto;min-width:0;padding:2px}
.nitem{background:var(--surface);border:1.5px solid transparent;border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.nitem:hover{box-shadow:var(--shadow-h)}
.nitem[aria-current="true"]{border-color:var(--note)}
.nitem .nt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .np{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.newnote{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:9px;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.newnote:hover{border-color:var(--note);color:var(--note)}
.npane{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.nhead{display:flex;gap:8px;align-items:center;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ntitle{flex:1;min-width:180px;border:none;background:transparent;font-size:19px;font-weight:700;outline:none;padding:4px 0}
.ntitle::placeholder{color:var(--faint)}
.nhead select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px;font-size:13px}
.nbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.nbody.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.nbody.split{grid-template-columns:minmax(0,1fr)}}
.nedit{border:none;outline:none;resize:none;background:var(--surface-2);padding:16px 18px;font-family:var(--mono);font-size:13px;line-height:1.7;min-height:360px;height:100%;width:100%}
.nbody.split .nedit{border-right:1px solid var(--line)}
.nedit.drop{outline:2px dashed var(--note);outline-offset:-8px}
.nprev{padding:16px 22px;overflow:auto;min-height:360px}
.nfoot{display:flex;gap:12px;align-items:center;padding:8px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);flex-wrap:wrap}
.nempty{margin:auto;text-align:center;color:var(--faint);padding:40px;display:flex;flex-direction:column;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13px;z-index:30;box-shadow:var(--shadow-h);max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 收件箱：左边会话列表，右边像聊天一样的消息流，输入框在最下面 ===== */
.ibx{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:420px}
.ibx-list{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;overflow:auto;padding:10px 8px;gap:2px;background:var(--surface-2)}
.ibx-sec{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--faint);margin:12px 8px 4px}
.ibx-sec .grow{flex:1}
.ibx-sec button{border:none;background:transparent;color:var(--faint);cursor:pointer;border-radius:6px;padding:2px 4px;display:inline-flex}
.ibx-sec button:hover{color:var(--accent);background:var(--surface)}
.conv{display:grid;grid-template-columns:34px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;border:none;background:transparent;border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.conv:hover{background:var(--surface)}
.conv[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.conv .av{grid-row:1/3;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600;color:#fff;background:var(--c,var(--accent))}
.conv .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .tm{font-size:11px;color:var(--faint);font-family:var(--num)}
.conv .pv{grid-column:2/3;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .badge{grid-column:3;justify-self:end;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-family:var(--num);display:grid;place-items:center;padding:0 5px}
.ibx-tip{margin:14px 8px 4px;font-size:12px;color:var(--faint);line-height:1.6}
.ibx-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.ibx-h{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ibx-h h2{margin:0;font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibx-h .sub{font-size:12px;color:var(--muted)}
.ibx-h .grow{flex:1}
.ibx-h .back{display:none}
@media (max-width:760px){.ibx-h .back{display:grid}}
.ibx-h .search{max-width:220px}
.ibx-stream{flex:1;min-height:0;overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(var(--surface),var(--surface-2) 140%)}
.ibx-day{align-self:center;font-size:11.5px;color:var(--faint);background:var(--surface-2);border-radius:999px;padding:2px 10px;margin:10px 0 4px}
.ibx-new{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--accent);margin:8px 0}
.ibx-new::before,.ibx-new::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.4}
.ibx-more{align-self:center}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:min(760px,88%);position:relative;border-radius:12px;padding:2px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .who{font-size:12px;color:var(--muted);margin:0 0 3px 2px}
.msg.me .who{text-align:right;margin:0 2px 3px 0}
.msg .col{min-width:0;display:flex;flex-direction:column}
.msg.me .col{align-items:flex-end}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0;overflow-wrap:anywhere;font-size:14px;line-height:1.6;box-shadow:var(--shadow)}
.msg.me .bub{background:var(--accent-soft);border-color:transparent;border-radius:14px 4px 14px 14px}
.bub .md{font-size:14px}
.bub .md>:first-child{margin-top:0}.bub .md>:last-child{margin-bottom:0}
.bub .md img{max-width:min(320px,100%);max-height:260px;border-radius:8px;cursor:zoom-in;display:block;margin:4px 0}
.bub .t1{font-weight:500;white-space:pre-wrap}
.bub .wxt{white-space:pre-wrap}
.bub .wximg{max-width:min(300px,100%);max-height:240px;border-radius:8px;cursor:zoom-in;display:block;margin:4px 0;background:var(--surface-2);min-width:60px;min-height:40px}
.bub .file{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:8px;padding:4px 10px;margin:3px 0;font-size:13px;color:var(--fg);text-decoration:none}
.bub .file.miss{color:var(--faint)}
.msg .meta{font-size:11.5px;color:var(--faint);margin:3px 2px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg .tools{position:absolute;top:-26px;right:auto;left:0;display:none;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--shadow-h);z-index:2}
.msg.me .tools{right:0;left:auto}
.msg:hover .tools{display:flex}
.selecting .msg:hover .tools{display:none}
.msg .tools button{border:none;background:transparent;border-radius:7px;padding:3px 8px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.msg .tools button .i{width:14px;height:14px}
.msg .tools button:hover{background:var(--surface-2);color:var(--c,var(--accent))}
.msg .tools .sep{width:1px;background:var(--line);margin:3px 2px}
.msg .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:22px;display:none;place-items:center;color:var(--accent-fg);font-size:11px}
.selecting .msg .ck,.msg:hover .ck{display:grid}
.msg.sel .ck{background:var(--accent);border-color:var(--accent)}
.msg.sel .bub{outline:2px solid var(--accent);outline-offset:1px}
.selecting .msg{cursor:pointer}
.ibx-bottom{border-top:1px solid var(--line);padding:10px 14px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.composer{display:flex;gap:10px;align-items:flex-end;background:var(--surface-2);border-radius:14px;padding:6px 6px 6px 14px;border:1px solid transparent}
.composer:focus-within{border-color:var(--accent);background:var(--surface)}
.composer.drop{outline:2px dashed var(--accent);outline-offset:2px}
.composer textarea{flex:1;min-width:0;resize:none;border:none;background:transparent;outline:none;font-size:15px;line-height:1.55;padding:6px 0;max-height:220px;min-height:24px}
.composer .btn{border-radius:10px}
.ibx-bottom .hint{padding:0 4px}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.selbar b{font-family:var(--num)}
.selbar .grow{flex:1}
.ibx-empty{margin:auto;text-align:center;color:var(--faint);font-size:13px;line-height:1.8;max-width:360px}
.ibx-empty b{color:var(--muted);font-size:15px;display:block;margin-bottom:4px}
.imp-senders{display:flex;flex-wrap:wrap;gap:6px}
.imp-senders label{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.imp-senders label{white-space:nowrap;color:var(--fg)}
.imp-senders input{accent-color:var(--accent);width:auto;padding:0;border:none;margin:0}
.imp-stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.imp-stat b{font-family:var(--num);font-size:18px;display:block}
@media (max-width:760px){.ibx{grid-template-columns:minmax(0,1fr)}.ibx-list{display:none}.ibx.listing .ibx-list{display:flex}.ibx.listing .ibx-main{display:none}}
.toast button{margin-left:12px;border:none;background:transparent;color:inherit;text-decoration:underline;font-weight:600;cursor:pointer;padding:0}

/* ===== 滚动条：细、圆角、颜色跟随主题；侧栏列表只在鼠标移上去时显示 ===== */
:root{--sb:color-mix(in srgb,var(--fg) 20%,transparent);--sb-h:color-mix(in srgb,var(--fg) 36%,transparent)}
::-webkit-scrollbar{width:10px;height:10px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:padding-box;min-height:36px}
::-webkit-scrollbar-thumb:hover{background:var(--sb-h);background-clip:padding-box;border-width:2px}
::-webkit-scrollbar-thumb:active{background:var(--sb-h);background-clip:padding-box;border-width:2px}
::-webkit-scrollbar-button{display:none;width:0;height:0}
.ibx-list::-webkit-scrollbar-thumb,.nnav::-webkit-scrollbar-thumb,.nlist::-webkit-scrollbar-thumb{background:transparent;background-clip:padding-box}
.ibx-list:hover::-webkit-scrollbar-thumb,.nnav:hover::-webkit-scrollbar-thumb,.nlist:hover::-webkit-scrollbar-thumb{background:var(--sb);background-clip:padding-box}
.md pre::-webkit-scrollbar,.md table::-webkit-scrollbar{height:8px}
/* 不支持 ::-webkit-scrollbar 的浏览器（Firefox）用标准写法 */
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}

/* ===== 右侧阅读面板：任意条目（主要是笔记）在右边完整展示，左边照常干活 ===== */
.shell.side-open{grid-template-columns:minmax(0,1fr) var(--side-w,560px)}
.shell.side-open .rail{display:none}
.card.viewing,.fcard.viewing{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.msg.viewing .bub{outline:2px solid var(--accent);outline-offset:1px}
.shell.side-full{grid-template-columns:minmax(0,1fr)}
.shell.side-full .main{display:none}
.side{position:sticky;top:16px;height:calc(100vh - 32px);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-h);display:flex;flex-direction:column;min-width:0}
.side-grip{position:absolute;left:-15px;top:0;bottom:0;width:14px;cursor:col-resize;display:flex;justify-content:center;touch-action:none}
.side-grip::after{content:"";width:3px;height:100%;border-radius:3px;background:transparent;transition:background .15s}
.side-grip:hover::after,.side.resizing .side-grip::after{background:var(--accent)}
.shell.side-full .side-grip{display:none}
.side-h{display:flex;align-items:center;gap:4px;padding:12px 12px 10px 20px;border-bottom:1px solid var(--line)}
.side-h .kind{font-size:12px;color:var(--c);background:var(--soft);border-radius:6px;padding:1px 7px;flex:none}
.side-h h2{flex:1;min-width:0;margin:0 6px 0 4px;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-h input{flex:1;min-width:0;margin:0 6px 0 4px;font-size:16px;font-weight:700;border:none;background:transparent;outline:none;padding:0}
.side-h .seg{margin-right:4px}
.side-meta{padding:8px 20px 0;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.side-meta:empty{display:none}
.side-body{flex:1;min-height:0;overflow:auto;padding:14px 24px 28px}
.shell.side-full .side-body>*{max-width:880px;margin-left:auto;margin-right:auto}
.side-body .md img{max-width:100%;height:auto}
.side-body textarea{display:block;width:100%;height:100%;min-height:300px;border:none;resize:none;outline:none;background:transparent;font-family:var(--mono);font-size:13.5px;line-height:1.75;color:var(--fg)}
.side-body textarea.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.side-foot{display:flex;gap:10px;padding:8px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.side-foot .grow{flex:1}
/* 右侧打开时左边变窄：按左边实际宽度排版（而不是按窗口宽度） */
.main{container-type:inline-size;container-name:main}
@container main (max-width:980px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}.notes.withnav{grid-template-columns:260px minmax(0,1fr)}.notes.withnav .nnav{display:none}}
@container main (max-width:640px){.lanes{grid-template-columns:minmax(0,1fr)}.notes,.notes.withnav{grid-template-columns:minmax(0,1fr);height:auto}.nlist{max-height:320px}
  .ibx{grid-template-columns:minmax(0,1fr)}.ibx-list{display:none}.ibx.listing .ibx-list{display:flex}.ibx.listing .ibx-main{display:none}.ibx-h .back{display:grid}}
@media (max-width:1100px){.shell.side-open .side{position:fixed;inset:12px;z-index:15;height:auto}.shell.side-open .side-grip{display:none}}

/* ===== 项目（笔记展开成 AI 的工作目录）、AI 进展、模板 ===== */
.aistat{font-size:11.5px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:0 6px;white-space:nowrap}
.wschip{display:inline-flex;align-items:center;gap:4px;border:none;background:var(--surface-2);color:var(--muted);border-radius:5px;padding:0 6px;font:inherit;cursor:pointer}
.wschip .i{width:12px;height:12px}.wschip:hover{color:var(--accent)}
.projtoggle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:500;cursor:pointer}
.projtoggle input{accent-color:var(--accent)}
.projtoggle .hint{font-weight:400}
.projbox{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.projbox .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.projbox .field input,.projbox select{background:var(--surface)}
.projbox select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.projcur{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.projcur .path{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere}
.aiprog{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.aiprog h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.aip{border-left:3px solid var(--line);padding:4px 0 6px 12px;margin:0 0 10px}
.aip-h{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--faint)}
.aip .md{font-size:13.5px}
.aip-f{font-size:12px;color:var(--muted)}
.tpllist{display:flex;flex-direction:column;gap:14px}
.tplrow{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tplrow .t-name{font-weight:600;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2);min-width:200px}
.tplrow textarea{min-height:90px}
.aplist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.apitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:none;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.apitem:hover{background:var(--surface-2)}
.apitem span{font-size:12px;color:var(--faint)}

/* ===== 划词问 AI ===== */
.qa-float{position:absolute;z-index:40;display:inline-flex;align-items:center;gap:5px;border:none;border-radius:999px;padding:5px 12px;background:var(--fg);color:var(--bg);font-size:12.5px;box-shadow:var(--shadow-h);cursor:pointer}
.qa-float .i{width:14px;height:14px}
mark.qa-mark{background:color-mix(in srgb,var(--idea) 22%,transparent);color:inherit;border-bottom:2px solid color-mix(in srgb,var(--idea) 70%,transparent);border-radius:2px;cursor:pointer;padding:0 1px}
mark.qa-mark.flash,.qa.flash,mark.flash{animation:qaflash 1.2s ease}
@keyframes qaflash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.qasec{margin-top:22px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.qasec h3{font-size:14px;margin:0;display:flex;align-items:center;gap:6px;color:var(--muted)}
.qasec h3 .n{font-size:12px;background:var(--surface-2);border-radius:999px;padding:0 7px}
.qasec h3 .grow,.qa-act .grow{flex:1}
.qasec h3 .btn,.qa-act .btn{padding:3px 9px;font-size:12px}
.qa-empty .hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qa{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.qa blockquote,.askq{margin:0;border-left:3px solid color-mix(in srgb,var(--idea) 70%,transparent);padding:2px 10px;color:var(--muted);font-size:12.5px;cursor:pointer;max-height:6.5em;overflow:hidden;white-space:pre-wrap}
.askq{cursor:default}
.qa .lost{color:var(--danger);font-size:11.5px}
.qa-ask{font-weight:600}
.qa-ask::before{content:"问 ";color:var(--accent)}
.qa-t .md{font-size:13.5px}
.qa-t .md>:first-child{margin-top:2px}
.qa-meta{font-size:11.5px;color:var(--faint)}
.qa-t+.qa-t{border-top:1px dashed var(--line);padding-top:6px}
.qa-act{display:flex;gap:4px;align-items:center}
.qa.pending{opacity:.85}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--faint);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 快速记录在右下角 ===== */
.rail{min-height:calc(100vh - 74px)}
.rail-body{display:flex;flex-direction:column;gap:18px}
.rail>.capture{margin-top:auto;position:sticky;bottom:20px;z-index:5;box-shadow:var(--shadow-h);padding:12px 14px 10px}
.rail>.capture #cap{font-size:15px}
.rail>.capture .seg button{padding:4px 8px}
.rail>.capture .cap-row{gap:8px}
.rail>.capture #capBtn{padding:7px 12px}
.rail>.capture .hint{display:none}
.rail>.capture:focus-within .hint{display:block}
.main>.capture{position:sticky;bottom:16px;z-index:5;box-shadow:var(--shadow-h);order:99}
</style>

  <div class="main">
    <header class="hello">
      <div>
        <div class="date" id="date"></div>
        <h1><span id="greet">工作台</span><button class="status" id="status" title="连接与设置"><i></i><span>连接中…</span></button><button class="status themebtn" id="themeBtn"></button></h1>
      </div>
      <span class="grow"></span>
      <div class="sum" id="sum"></div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <nav class="tabs" role="tablist">

<script>
(()=>{
/* ================= 基础 ================= */
const TYPES=[
  {k:"todo", name:"待办", c:"todo", check:"完成", lane:true},
  {k:"issue",name:"问题", c:"issue",check:"已解决", lane:true},
  {k:"idea", name:"灵感", c:"idea", check:"已落地", lane:true},
  {k:"note", name:"笔记", c:"note", check:null},
  {k:"link", name:"入口", c:"link", check:null},
  {k:"rule", name:"规范与工作流", short:"规范", c:"rule", check:null},
];
/* 设备来自数据库（S.devices，随状态一起下发）；条目的 device 字段存设备名字 */
const devNames=()=>(S.devices||[]).map(d=>d.name);
const T=Object.fromEntries(TYPES.map(t=>[t.k,t]));
const TAURI=window.__TAURI__||null;
const IS_APP=!!(TAURI&&TAURI.core);
const invoke=IS_APP?TAURI.core.invoke:null;
const S={items:[],rev:null,capType:"todo",q:"",dev:null,tag:null,cat:null,categories:[],showDone:false,editing:null,addingTo:null,open:new Set(),doneOpen:new Set(),
  tab:"work",conn:{state:"",text:"连接中…"},offline:null,cfg:null,lan:null,lastErr:null};
try{S.tab=localStorage.getItem("wb-tab")||"inbox"}catch(e){S.tab="inbox"}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico=(n,cls="i")=>`<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const cv=t=>`--c:var(--${t.c});--soft:var(--${t.c}-soft)`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function ago(ts){if(!ts)return"";const d=(Date.now()-ts)/1000;if(d<60)return"刚刚";if(d<3600)return Math.floor(d/60)+" 分钟前";if(d<86400)return Math.floor(d/3600)+" 小时前";if(d<86400*30)return Math.floor(d/86400)+" 天前";const x=new Date(ts);return (x.getMonth()+1)+"月"+x.getDate()+"日"}
const ASSET_PREFIX="https://asset.local/";
function mdHTML(src){
  const text=String(src||"").replace(/\]\(asset:/g,"]("+ASSET_PREFIX);
  if(!window.marked||!window.DOMPurify)return `<p>${fmtBody(src)}</p>`;
  return DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:true}),{ADD_ATTR:["target"]});
}
const assetCache=new Map();
function assetName(u){return u&&u.startsWith(ASSET_PREFIX)?u.slice(ASSET_PREFIX.length):null}
async function assetSrc(name){
  if(!IS_APP)return "/api/asset/"+encodeURIComponent(name);
  if(!assetCache.has(name))assetCache.set(name,invoke("get_asset",{name}).catch(e=>{assetCache.delete(name);throw e}));
  return assetCache.get(name);
}
function hydrate(root){
  root.querySelectorAll("img").forEach(img=>{const sz=String(img.alt||"").match(/\|(\d{2,4})$/);if(sz){img.dataset.w=sz[1];img.alt=img.alt.replace(/\|\d{2,4}$/,"")}
    const n=assetName(img.getAttribute("src"));if(!n)return;img.removeAttribute("src");img.alt=img.alt||n;assetSrc(n).then(u=>img.src=u).catch(()=>{img.alt="图片读取失败："+n})});
  root.querySelectorAll("a[href]").forEach(a=>{const n=assetName(a.getAttribute("href"));if(n){a.dataset.asset=n;a.removeAttribute("target")}else a.target="_blank"});
}
const IMG_MD=/!\[[^\]]*\]\(asset:([A-Za-z0-9._-]+)\)/g;
/** 正文除了图片还有没有文字（只有截图时，收起的卡片不显示空白正文） */
function hasText(it){return String(it.body||"").replace(IMG_MD,"").trim().length>0}
/** 收起的卡片里，正文中的图片显示成一排缩略图（点开看大图） */
function thumbsHTML(it){
  if(S.open.has(it.id))return "";
  const ns=[...String(it.body||"").matchAll(IMG_MD)].map(m=>m[1]);
  if(!ns.length)return "";
  return `<div class="thumbs">${ns.slice(0,4).map(n=>`<img src="${ASSET_PREFIX}${n}" alt="">`).join("")}${ns.length>4?`<span class="more-n">+${ns.length-4}</span>`:""}</div>`;
}
function mdBlock(it,extra){return `<div class="b md ${extra||""}">${mdHTML(it.body)}</div>`}
function fmtBody(s){let h=esc(s);h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>");h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');return h}

/* ================= 入口：识别目标与所属机器 ================= */
const RE_URL=/(?:https?|smb):\/\/[^\s<>"`]+/i;
const RE_FILEURL=/file:\/\/[^\s<>"`]+/i;
const RE_UNC=/\\\\[^\s\\<>"`|?*]+(?:\\[^\n<>"`|?*]*)?/;
const RE_DRIVE=/\b[A-Za-z]:\\[^\n<>"`|?*]*/;
const RE_POSIX=/(?:^|\s)(\/(?:Volumes|mnt|home|Users|srv|data)\/[^\s<>"`]*)/;
const RE_SSH=/\bssh\s+[^\n`]+/;
function findTarget(text){
  for(const re of [RE_URL,RE_FILEURL,RE_UNC,RE_DRIVE]){const m=text.match(re);if(m)return m[0].trim().replace(/[，。；,;]+$/,"")}
  const p=text.match(RE_POSIX);if(p)return p[1].trim();
  const s=text.match(RE_SSH);if(s)return s[0].trim();
  return null;
}
function entryTarget(it){return findTarget((it.body||"")+"\n"+(it.title||""))}
function isPrivateHost(h){return /^(10\.|127\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h)||!h.includes(".")||/\.(local|lan|home)$/i.test(h)}
function hostOf(target){
  if(!target)return {key:"其他",kind:"other"};
  let m;
  if((m=target.match(/^\\\\([^\\]+)/)))return {key:m[1].toUpperCase(),kind:"pc"};
  if((m=target.match(/^file:\/\/([^/]+)\//i))&&!/^[a-z]:$/i.test(m[1]))return {key:m[1].toUpperCase(),kind:"pc"};
  if((m=target.match(/^smb:\/\/([^/]+)/i)))return {key:m[1].toUpperCase(),kind:"pc"};
  if((m=target.match(/^ssh\s+(?:\S+@)?([^\s:]+)/i)))return {key:m[1].toUpperCase(),kind:"server"};
  if((m=target.match(/^https?:\/\/([^/:]+)/i))){const h=m[1];return isPrivateHost(h)?{key:h.toUpperCase(),kind:"server"}:{key:"网站",kind:"web"}}
  if(/^[a-z]:\\/i.test(target))return {key:"本机磁盘",kind:"disk"};
  if(target.startsWith("/"))return {key:"本机路径",kind:"disk"};
  return {key:"其他",kind:"other"};
}
const KIND_ICON={pc:"pc",server:"server",web:"globe",disk:"disk",other:"folder"};
function autoTitle(target){
  let t=target.replace(/[\\/]+$/,"");
  if(/^https?:\/\//i.test(t)){try{const u=new URL(t);return (u.hostname+(u.pathname!=="/"?u.pathname:"")).replace(/\/$/,"")}catch(e){return t}}
  const seg=t.split(/[\\/]/).filter(Boolean);return seg[seg.length-1]||t;
}

/* ================= 数据接口 ================= */
const api=IS_APP?{
  state:()=>invoke("get_state"),
  rev:()=>invoke("get_rev"),
  apply:op=>invoke("apply_op",{op}),
}:{
  state:()=>jfetch("/api/state"),
  rev:()=>jfetch("/api/rev").then(r=>r.rev),
  apply:op=>jfetch("/api/op",{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(op)}),
};
async function jfetch(u,o){let r;try{r=await fetch(u,o)}catch(e){throw "连不上工作台主机"}const j=await r.json().catch(()=>({}));if(!r.ok)throw j.error||("请求失败 "+r.status);return j}
function errText(e){return typeof e==="string"?e:(e&&e.message)||String(e)}

function takeState(st){
  S.items=Array.isArray(st.items)?st.items:[];S.rev=st.rev;
  if(Array.isArray(st.devices))S.devices=st.devices;
  if(Array.isArray(st.categories))S.categories=st.categories;
  S.offline=st.offline?{pending:st.pending||0,error:st.error}:null;
  S.lastErr=null;updateConn();render();scheduleWsSync();
}
function updateConn(){
  if(S.lastErr)S.conn={state:"bad",text:"连接出错"};
  else if(S.offline)S.conn={state:"warn",text:S.offline.pending?`离线 · ${S.offline.pending} 条待上传`:"离线 · 显示缓存"};
  else if(!IS_APP)S.conn={state:"ok",text:"网页版 · 已连接"};
  else if(S.cfg&&S.cfg.mode==="host")S.conn={state:"ok",text:S.lan&&S.lan.running?"本机存储 · 局域网已开放":"本机存储"};
  else if(S.cfg&&S.cfg.mode==="client")S.conn={state:"ok",text:"已连接主机"};
  renderStatus();renderBanner();
}
async function load(){
  try{takeState(await api.state())}
  catch(e){S.lastErr=errText(e);updateConn();return}
  // 导入的聊天走 /api/v1（离线时读不到就沿用上次的）
  await loadChats();if(S.tab==="inbox")renderInbox();renderHeader();
}
let polling=false;
async function poll(){
  if(polling||document.hidden)return;
  if(IS_APP&&!(S.cfg&&S.cfg.mode))return;
  polling=true;
  try{const r=await api.rev();if(r!==S.rev||S.lastErr)await load()}
  catch(e){S.lastErr=errText(e);updateConn()}
  finally{polling=false}
}
async function applyOp(op,optimistic){
  if(optimistic){optimistic();render()}
  try{takeState(await api.apply(op))}
  catch(e){toast("保存失败："+errText(e));await load();throw e}
}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function addItem(p){
  const now=Date.now();const item={id:newId(),type:p.type,title:p.title,body:p.body||"",tags:p.tags||[],device:p.device||"",done:false,pinned:!!p.pinned,createdAt:now,updatedAt:now};
  // 正在看某个分类 / 标签时，新建的条目自动放进去
  const cat=p.category!==undefined?p.category:curCat();if(cat)item.category=cat;
  if(S.tag&&!item.tags.includes(S.tag))item.tags=[...item.tags,S.tag];
  if(p.priority)item.priority=p.priority;if(p.due)item.due=p.due;
  await applyOp({kind:"upsert",item},()=>S.items.push(item));
  return item.id;
}
async function patch(it,ch){
  const item={...it,...ch,updatedAt:ch.updatedAt||Date.now()};
  await applyOp({kind:"upsert",item},()=>{const i=S.items.findIndex(x=>x.id===it.id);if(i>=0)S.items[i]=item});
}
async function removeItem(id){await applyOp({kind:"delete",id},()=>{S.items=S.items.filter(x=>x.id!==id)})}

/* ================= 打开 / 复制 ================= */
async function copyText(v){
  try{await navigator.clipboard.writeText(v);return true}catch(e){
    const ta=document.createElement("textarea");ta.value=v;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(x){}ta.remove();return ok}
}
async function openTarget(t){
  if(/^ssh\s/i.test(t)){if(await copyText(t))toast("已复制命令："+t);return}
  if(IS_APP){try{await invoke("open_target",{target:t})}catch(e){toast(errText(e))}return}
  if(/^https?:\/\//i.test(t)){window.open(t,"_blank","noopener");return}
  if(await copyText(t))toast("网页版不能直接打开本地路径，已复制："+t);else toast("请手动复制："+t);
}

/* ================= 渲染 ================= */
/** 设备和关键词（分类、标签另外判断，笔记页左侧的数量要用） */
function baseMatch(it){
  if(S.dev&&it.device&&it.device!==S.dev)return false;
  if(S.q){const q=S.q.toLowerCase();if(!(it.title+" "+(it.body||"")+" "+(it.tags||[]).join(" ")+" "+(it.category||"")).toLowerCase().includes(q))return false}
  return true;
}
function match(it){
  if(!baseMatch(it))return false;
  if(S.tag&&!(it.tags||[]).includes(S.tag))return false;
  return catMatch(it);
}
const byRecent=(a,b)=>(b.updatedAt||0)-(a.updatedAt||0);

function metaHTML(it){

  const di=dueInfo(it);if(di)parts.unshift(`<span class="due ${di.cls}" title="截止 ${esc(it.due)}">${di.text}</span>`);
  if(it.category&&S.cat!==it.category)parts.unshift(`<button class="catchip" data-catpick="${esc(it.category)}" title="只看这个分类">${esc(it.category)}</button>`);
  if(it.device)parts.push(`<span class="dev" title="${devOnline(devByName(it.device))?"在线":""}">${esc(it.device)}</span>`);
  const pc=progressChip(it);if(pc)parts.push(pc);const wc=wsChip(it);if(wc)parts.push(wc);
  const last=(it.agentLog||[]).slice(-1)[0];
  if(last)parts.push(`<span class="ailog" title="${esc((it.agentLog||[]).map(x=>x.agent+" · "+new Date(x.at).toLocaleString()).join("\n"))}">已交给 ${esc(last.agent)} · ${ago(last.at)}</span>`);

const PRIS=[["P0","紧急"],["P1","高"],["P2","中"],["P3","低"]];
function normCat(s){return String(s||"").split(/[\/\\]/).map(x=>x.trim()).filter(Boolean).slice(0,5).join("/")}
const inCat=(c,p)=>!!c&&(c===p||c.startsWith(p+"/"));
const parentCat=p=>p.includes("/")?p.slice(0,p.lastIndexOf("/")):"";
function allCats(){const set=new Set();const add=p=>{if(!p)return;let cur="";for(const seg of String(p).split("/")){cur=cur?cur+"/"+seg:seg;set.add(cur)}};(S.categories||[]).forEach(add);S.items.forEach(i=>add(i.category));return [...set].sort((a,b)=>a.localeCompare(b,"zh"))}
function allTags(list){const m=new Map();(list||S.items).forEach(i=>(i.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"zh"))}

function dateStr(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return dateStr(d)}
/** 记录时的 ~日期：今天 明天 后天 大后天 3天后 周五 下周一 10-8 2026-10-08 */
function parseDue(s){
  s=String(s).trim();let m;
  const words={"今天":0,"明天":1,"后天":2,"大后天":3};if(s in words)return addDays(words[s]);
  if((m=s.match(/^\+?(\d{1,3})天后?$/)))return addDays(+m[1]);
  if((m=s.match(/^(下)?(?:周|星期|礼拜)([一二三四五六日天])$/))){const w="日一二三四五六".indexOf(m[2]==="天"?"日":m[2]);const today=new Date().getDay();
    if(m[1]){const mon=(today+6)%7,target=(w+6)%7;return addDays(7-mon+target)}return addDays((w-today+7)%7)}
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return `${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`;
  if((m=s.match(/^(\d{1,2})[-/.月](\d{1,2})日?$/))){const y=new Date().getFullYear();let d=`${y}-${pad2(+m[1])}-${pad2(+m[2])}`;if(d<addDays(0))d=`${y+1}-${pad2(+m[1])}-${pad2(+m[2])}`;return d}
  return null;
}
function normPri(s){s=String(s||"").trim().toUpperCase().replace(/^P/,"");const w={"紧急":"0","高":"1","中":"2","低":"3"}[s]??s;return /^[0-3]$/.test(w)?"P"+w:null}
function dueInfo(it){
  if(!it.due||it.done)return null;
  const days=Math.round((new Date(it.due+"T00:00:00")-new Date(addDays(0)+"T00:00:00"))/864e5);
  const text=days===0?"今天到期":days===1?"明天到期":days===-1?"昨天到期":days<0?`逾期 ${-days} 天`:days<7?`${days} 天后到期`:`截止 ${+it.due.slice(5,7)}-${+it.due.slice(8,10)}`;
  return {text,cls:days<0?"late":days<=1?"soon":""};
}
function priHTML(it){return it.priority&&!it.done?`<span class="pri ${esc(it.priority)}" title="优先级 ${esc(it.priority)}">${esc(it.priority)}</span>`:""}
const priRank=it=>{const i=["P0","P1","P2","P3"].indexOf(it.priority||"");return i<0?9:i};
/** 未完成事项的顺序：优先级 → 截止日期（近的在前，没有的在后）→ 最近更新 */
const byPri=(a,b)=>priRank(a)-priRank(b)||(a.due||"9999").localeCompare(b.due||"9999")||byRecent(a,b);

function parseCapture(raw,type){
  const tags=[];let device="",priority="",due="";
  const text=raw.replace(/(^|\s)!(P?[0-3]|紧急|高|中|低)(?=\s|$)/gi,(m,a,x)=>{const p=normPri(x);if(!p)return m;priority=p;return a}).replace(/(^|\s)~(\S+)(?=\s|$)/g,(m,a,x)=>{const d=parseDue(x);if(!d)return m;due=d;return a}).replace(/(^|\s)#([^\s#@\\/]+)/g,(m,a,t)=>{tags.push(t);return a}).replace(/(^|\s)@([^\s#@]+)(?=\s|$)/g,(m,a,d)=>{const dv=findDevice(d);if(!dv)return m;device=dv.name;return a});
  const lines=text.split("\n").map(s=>s.trim()).filter(Boolean);
  let title=lines.shift()||"",body=lines.join("\n");
  if(type==="link"){
    const tgInTitle=findTarget(title);
    if(tgInTitle&&tgInTitle.length>=title.length-2){ // 第一行就是路径/网址
      body=[tgInTitle,body].filter(Boolean).join("\n");title=autoTitle(tgInTitle);
    }
  }
  return {title,body,tags,device,priority,due};
}

  if(IS_APP)return invoke("put_asset",{name,data});

const IMG_SIZES=[["小",240],["中",480],["大",800],["自动",0]];

    if(w)img.style.width=w+"px";
    box.insertAdjacentHTML("beforeend",`<span class="imgtools">${IMG_SIZES.map(([n,v])=>`<button data-isz="${v}" aria-pressed="${v===w||(!v&&!w)}" title="${v?`宽 ${v}px`:"默认大小"}">${n}</button>`).join("")}</span><span class="imghandle" title="拖动调整大小"></span>`);

function setNoteImageSize(idx,w){

  const ed=$("#nEdit");const src=ed?ed.value:it.body;let n=-1;
  const out=src.replace(/!\[([^\]]*)\]\(/g,(m,alt)=>{n++;if(n!==idx)return m;const base=alt.replace(/\|\d{2,4}$/,"");return `![${w?base+"|"+Math.round(w):base}](`});
  if(out===src)return;
  if(ed){ed.value=out;ed.dispatchEvent(new Event("input"))}

function buildPrompt(it){
  const t=T[it.type]||T.todo;
  const lines=[`下面是我工作台里的一条「${t.name}」，请帮我处理。`,"",`标题：${it.title}`];
  if(it.body)lines.push("详情：",it.body);

}

function agentRow(a){return `<div class="agent-row"><input class="name" value="${esc(a.name)}" placeholder="名称" aria-label="名称"><input class="cmd" value="${esc(a.cmd)}" placeholder="命令，如 claude {prompt}" aria-label="命令"><input class="cmd ask" value="${esc(a.ask||"")}" placeholder="问答命令（可空）" title="划词问 AI 时用的非交互命令，提示词从标准输入传入。留空时 claude / codex 会自动用 claude -p / codex exec -" aria-label="问答命令"><button class="ic" data-delagent title="删除" aria-label="删除">${ico("x")}</button></div>`}
function closeModal(){$("#modalRoot").innerHTML=""}
function openSettings(first){
  const c=S.cfg||{mode:"",dataDir:"",serverUrl:"",port:8765,lanEnabled:true};
  let mode=c.mode||"host";
  const root=$("#modalRoot");
  root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">${first?"欢迎使用工作台":"连接与设置"}</h2>
    <p>${first?"先选这台电脑的角色。存数据的只需要一台（建议选一直开机、硬盘够大的那台），其他电脑选「连接到主机」。":"数据只存在主机上；其他电脑和浏览器都连主机。"}</p>
    <div class="choices" role="radiogroup">
      <div class="choice" role="radio" tabindex="0" data-mode="host"><h3>这台电脑存数据（主机）</h3><p>数据写在下面的文件夹里，每天自动备份一份到 backups。</p>
        <label class="field">数据文件夹<input id="fDir" value="${esc(c.dataDir)}" placeholder="例如 D:\\xpanel"></label>
        <label class="field">冷备份文件夹（可选，比如 8TB 盘；每天复制一份备份和新附件过去）<input id="fCold" value="${esc(c.coldBackupDir||"")}" placeholder="留空 = 不做冷备份"></label>
        <label class="toggle"><input type="checkbox" id="fLan" ${c.lanEnabled?"checked":""}> 在局域网开放（其他电脑和浏览器访问要用）</label>
        <label class="field">端口<input id="fPort" value="${c.port||8765}" inputmode="numeric" style="width:120px"></label></div>
      <div class="choice" role="radio" tabindex="0" data-mode="client"><h3>连接到主机</h3><p>这台电脑不存数据。连不上时照常能看、能记，恢复后自动上传。</p>
        <label class="field">主机地址<input id="fUrl" value="${esc(c.serverUrl)}" placeholder="http://主机名或IP:8765"></label></div>
    </div>
    ${first?"":`<div class="field"><span>可以交给的 AI（命令里的 <code>{prompt}</code> 会换成提示词；以 http 开头的会在浏览器打开）</span>
      <div class="agent-rows" id="fAgents">${(c.agents||[]).map(a=>agentRow(a)).join("")}</div>
      <div class="row" style="margin-top:4px"><button class="btn" id="fAddAgent">${ico("plus")}添加</button></div></div>
      <label class="field">AI 默认工作目录<input id="fCwd" value="${esc(c.agentCwd||"")}" placeholder="留空 = 用户目录"></label>`}
    ${!first&&S.lan&&S.lan.running?`<p>局域网访问地址：${S.lan.urls.map(u=>`<code>${esc(u)}</code>`).join("　")}<br>给外部 AI 的接口文档：<code>${esc(S.lan.urls[0])}/api/v1/openapi.json</code></p>`:""}
    <div class="err" id="fErr"></div>
    <div class="row">
      <button class="btn primary" id="fSave">保存</button>${first?"":`<button class="btn ghost" id="fCancel">取消</button>`}
      <span style="flex:1"></span>
      ${first?"":`${c.mode==="host"?`<button class="btn" id="fOpenDir">${ico("folder")}打开数据文件夹</button>`:""}
      <button class="btn" id="fShortcut">桌面快捷方式</button>
      <label class="btn">导入 JSON<input type="file" accept=".json,application/json" id="fImport" hidden></label>
      <button class="btn" id="fExport">导出 JSON</button>`}
    </div></div></div>`;
  const sync=()=>root.querySelectorAll(".choice").forEach(el=>el.setAttribute("aria-checked",el.dataset.mode===mode));
  sync();
  root.querySelectorAll(".choice").forEach(el=>{el.onclick=()=>{mode=el.dataset.mode;sync()};el.onkeydown=ev=>{if(ev.key===" "){mode=el.dataset.mode;sync()}}});

  $("#fOpenDir")&&($("#fOpenDir").onclick=()=>invoke("open_data_dir").catch(e=>toast(errText(e))));
  $("#fExport")&&($("#fExport").onclick=exportJson);
  $("#fShortcut")&&($("#fShortcut").onclick=()=>invoke("create_desktop_shortcut").then(p=>toast("已放到桌面："+p)).catch(e=>toast(errText(e))));
  $("#fAddAgent")&&($("#fAddAgent").onclick=()=>$("#fAgents").insertAdjacentHTML("beforeend",agentRow({name:"",cmd:""})));
  $("#fAgents")&&($("#fAgents").onclick=ev=>{const d=ev.target.closest("[data-delagent]");if(d)d.closest(".agent-row").remove()});
  $("#fImport")&&($("#fImport").onchange=ev=>{const f=ev.target.files[0];if(f)importFile(f)});
  $("#fSave").onclick=async()=>{
    const agents=$("#fAgents")?[...document.querySelectorAll("#fAgents .agent-row")].map(r=>({name:r.querySelector(".name").value.trim(),cmd:r.querySelector(".cmd").value.trim(),ask:r.querySelector(".ask").value.trim()})).filter(a=>a.name&&a.cmd):(c.agents||[]);
    const cfg={mode,dataDir:$("#fDir").value.trim(),serverUrl:$("#fUrl").value.trim(),port:parseInt($("#fPort").value,10)||8765,lanEnabled:$("#fLan").checked,agents,agentCwd:$("#fCwd")?$("#fCwd").value.trim():(c.agentCwd||""),coldBackupDir:$("#fCold")?$("#fCold").value.trim():(c.coldBackupDir||"")};
    if(mode==="host"&&!cfg.dataDir){$("#fErr").textContent="请填写数据文件夹";return}
    if(mode==="client"&&!cfg.serverUrl){$("#fErr").textContent="请填写主机地址";return}
    const b=$("#fSave");b.disabled=true;b.textContent=mode==="client"?"正在连接主机…":"保存中…";$("#fErr").textContent="";
    try{const r=await invoke("save_config",{cfg});S.cfg=r.config;S.lan=r.lan;closeModal();if(r.lanError)toast(r.lanError);else toast("已保存");await load()}
    catch(e){$("#fErr").textContent=errText(e);b.disabled=false;b.textContent="保存"}
  };
}

/* ================= 界面热更新 =================
   主机数据文件夹里的 ui/index.html 如果比程序自带的新，就用它（不用重新打包安装） */
const uiVer=h=>{const m=String(h||"").match(/name="wb-ui-version" content="(\d+)"/);return m?+m[1]:0};
const MY_UI=uiVer(document.documentElement.outerHTML);
async function fetchNewerUI(){
  try{
    const h=IS_APP?await invoke("get_ui_override"):await fetch("/",{cache:"no-store"}).then(r=>r.ok?r.text():"");
    return h&&uiVer(h)>MY_UI?h:null;
  }catch(e){return null}
}
function swapUI(h){window.__WB_STOP=true;window.__WB_OVERRIDE=true;document.open();document.write(h);document.close()}
async function checkUIUpdate(){
  if(window.__WB_STOP)return;
  const h=await fetchNewerUI();if(!h)return;
  const b=$("#banner");if(!b||!b.hidden)return;
  b.hidden=false;b.innerHTML=`<span class="grow"><b>界面有新版本</b>　点刷新马上换上，数据不受影响。</span><button class="btn primary" id="uiReload">刷新</button>`;
  $("#uiReload").onclick=()=>IS_APP?swapUI(h):location.reload();
}

/* ================= 收件箱 =================
   左边：「随手记」+ 导入的微信聊天；右边像聊天软件一样的消息流，输入框在最下面。
   - 随手记：发出去的是 type=inbox 的条目（和其他条目一样同步、离线可用），之后一键归到待办 / 问题 / 笔记…
   - 微信聊天：导入「合并转发 → 导出」的 ZIP；选中消息后转成笔记 / 待办、复制 Markdown、交给 AI */
S.ibxSel=new Set();S.ibxFiles=[];S.chats=S.chats||[];S.me=S.me||[];S.msgs=null;S.ibxQ="";
try{S.ibx=localStorage.getItem("wb-ibx")||"me"}catch(e){S.ibx="me"}
const ibxIn=$("#ibxIn");
const isMe=s=>(S.me||[]).includes(s);
const INBOX_AUTO=/^(截图|附件) \d+-\d+ \d\d:\d\d$/;
const hm=d=>`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function dayLabel(d){
  if(d===dateStr(new Date()))return "今天";if(d===addDays(-1))return "昨天";
  const [Y,M,D]=d.split("-");return (+Y===new Date().getFullYear()?"":Y+"年")+(+M)+"月"+(+D)+"日";
}
function inboxItems(){return S.items.filter(i=>i.type==="inbox").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function unreadTotal(){return (S.chats||[]).reduce((n,c)=>n+(c.unread||0),0)}
async function loadChats(){
  try{const r=await v1("GET","/inbox/chats");S.chats=r.chats||[];S.chatsLoaded=true;if(!S.meLoaded){const m=await v1("GET","/inbox/me");S.me=m.me||[];S.meLoaded=true}}catch(e){}
}
const chatKey=c=>c?`${c.count}|${c.last&&c.last.time}|${c.readUpTo||""}`:"";
async function loadMsgs(id,more){
  const cur=S.msgs&&S.msgs.chat===id?S.msgs:null;
  const limit=more&&cur?cur.list.length+300:Math.max(300,cur?cur.list.length:0);
  const r=await v1("GET",`/inbox/messages?chat=${encodeURIComponent(id)}&limit=${limit}`);
  S.msgs={chat:id,list:r.messages||[],total:r.total||0,key:chatKey((S.chats||[]).find(c=>c.id===id))};
}
function setIbx(k){S.ibx=k;S.ibxSel.clear();S.ibxAnchor=null;S.ibxQ="";S.ibxScroll=k==="me"?"bottom":"unread";S.editing=null;$("#ibx").classList.remove("listing");try{localStorage.setItem("wb-ibx",k)}catch(e){}renderInbox()}

/* ---- 左边会话列表 ---- */
function convHTML(k,name,time,preview,badge,color,letter){
  return `<button class="conv" data-conv="${esc(k)}" aria-current="${S.ibx===k}" style="--c:${color}"><span class="av">${esc(letter)}</span><span class="nm">${esc(name)}</span><span class="tm">${esc(time||"")}</span><span class="pv">${esc(preview||"")}</span>${badge?`<span class="badge">${badge}</span>`:""}</button>`;
}
function shortTime(t){if(!t)return "";const [d,h]=String(t).split(" ");return d===dateStr(new Date())?h:d.slice(5).replace("-","/")}
function renderIbxList(){
  const items=inboxItems();const last=items[items.length-1];
  const lt=last?new Date(last.createdAt||0):null;
  let h=convHTML("me","随手记",lt?shortTime(dateStr(lt)+" "+hm(lt)):"",last?(INBOX_AUTO.test(last.title)?"[图片]":last.title):"发给自己，之后再归类",items.length,"var(--accent)","记");
  h+=`<div class="ibx-sec">微信聊天<span class="grow"></span><button data-wximport title="导入微信聊天记录（ZIP）" aria-label="导入微信聊天记录">${ico("plus")}</button></div>`;
  const palette=["#3563D1","#C98712","#6E54D8","#138C92","#D9503F","#4A5E80"];
  h+=(S.chats||[]).map((c,i)=>{const l=c.last||{};const pv=l.sender?`${l.sender}：${String(l.text||"").replace(/\s+/g," ")}`:"";
    return convHTML(c.id,c.name,shortTime(l.time),pv,c.unread,palette[i%palette.length],(c.name||"?").slice(0,1))}).join("");
  if(!(S.chats||[]).length)h+=`<div class="ibx-tip">微信里多选消息 → 合并转发 → 导出，把得到的 ZIP 拖到这里就能导入。</div>`;
  $("#ibxList").innerHTML=h;
}

/* ---- 随手记 ---- */
function ibxMeta(it){
  const p=[];const di=dueInfo(it);if(it.priority)p.push(priHTML(it));if(di)p.push(`<span class="due ${di.cls}">${di.text}</span>`);
  (it.tags||[]).forEach(t=>p.push(`<span>#${esc(t)}</span>`));if(it.device)p.push(`<span class="dev">${esc(it.device)}</span>`);if(it.category)p.push(`<span>${esc(it.category)}</span>`);
  return p.join("");
}
const TRIAGE=["todo","issue","idea","note","link"];
function ibxItemHTML(it){
  if(S.editing===it.id)return `<div style="align-self:stretch">${editorHTML(it)}</div>`;
  const d=new Date(it.createdAt||0);const showTitle=!(INBOX_AUTO.test(it.title||"")&&it.body);
  const body=`${showTitle?`<div class="t1">${fmtBody(it.title)}</div>`:""}${it.body?`<div class="md">${mdHTML(it.body)}</div>`:""}`;
  const tools=TRIAGE.map(k=>`<button style="${cv(T[k])}" data-tri="${k}" title="归到「${T[k].name}」">${ico(k)}${T[k].short||T[k].name}</button>`).join("")
    +`<span class="sep"></span><button data-ibxact="edit" title="改内容，或设置分类、标签、优先级后再归类">${ico("edit")}归类…</button><button data-ibxact="append" title="追加到某篇笔记的末尾">${ico("note")}追加到笔记</button><button data-ibxact="side" title="在右侧打开">${ico("side")}</button><button data-ibxact="copy" title="复制文字">${ico("copy")}</button><button data-ibxact="del" title="删除">${ico("trash")}</button>`;
  return `<div class="msg me ${S.ibxSel.has(it.id)?"sel":""}" data-iid="${esc(it.id)}"><span class="ck" data-ck>✓</span><div class="col"><div class="bub">${body}</div><div class="meta">${hm(d)}${ibxMeta(it)}</div></div><div class="tools">${tools}</div></div>`;
}
function renderMeStream(){
  const q=S.ibxQ.toLowerCase();
  const items=inboxItems().filter(i=>!q||((i.title||"")+"\n"+(i.body||"")).toLowerCase().includes(q));
  let h="",day="";
  for(const it of items){const d=dateStr(new Date(it.createdAt||0));if(d!==day){day=d;h+=`<div class="ibx-day">${dayLabel(d)}</div>`}h+=ibxItemHTML(it)}
  if(!items.length)h=q?`<div class="ibx-empty">没有找到「${esc(S.ibxQ)}」</div>`:`<div class="ibx-empty"><b>收件箱是空的</b>想到什么、截了什么图，直接在下面发进来。<br>之后再慢慢归到待办、问题、笔记里。</div>`;
  return h;
}

/* ---- 微信聊天 ---- */
function wxLineHTML(line,atts){
  const m=line.trim().match(/^\[([^\]]+)\]\s*(.+)$/);
  const a=m&&atts.find(x=>x.name===m[2].trim());
  if(!a)return fmtBody(line);
  if(a.missing)return `<span class="file miss" title="导出时没带上这个文件">📎 ${esc(a.name)}</span>`;
  if(a.kind==="image")return `<img class="wximg" src="${ASSET_PREFIX}${esc(a.asset)}" alt="${esc(a.name)}">`;
  return `<a class="file" href="${ASSET_PREFIX}${esc(a.asset)}" title="打开">${a.kind==="video"?"🎬":"📎"} ${esc(a.name)}</a>`;
}
function wxMsgHTML(m){
  const atts=m.attachments||[];const [,t]=String(m.time).split(" ");
  const body=String(m.text||"").split("\n").map(l=>wxLineHTML(l,atts)).join("\n");
  return `<div class="msg ${isMe(m.sender)?"me":""} ${S.ibxSel.has(m.id)?"sel":""}" data-mid="${esc(m.id)}"><span class="ck" data-ck>✓</span><div class="col"><div class="who">${esc(m.sender)} · ${esc(t||"")}</div><div class="bub"><div class="wxt">${body}</div></div></div></div>`;
}
function wxVisible(){const q=S.ibxQ.toLowerCase();return (S.msgs?S.msgs.list:[]).filter(m=>!q||(m.sender+"\n"+m.text).toLowerCase().includes(q))}
function renderChatStream(c){
  if(!S.msgs||S.msgs.chat!==c.id)return `<div class="ibx-empty">正在读取…</div>`;
  const list=wxVisible();let h="",day="",divided=false;
  if(S.msgs.total>S.msgs.list.length&&!S.ibxQ)h+=`<button class="btn ghost ibx-more" data-wxmore>显示更早的消息（还有 ${S.msgs.total-S.msgs.list.length} 条）</button>`;
  for(const m of list){
    const d=String(m.time).split(" ")[0];
    if(c.readUpTo&&!divided&&m.time>c.readUpTo){divided=true;h+=`<div class="ibx-new" id="ibxNew">以下是没处理过的消息</div>`}
    if(d!==day){day=d;h+=`<div class="ibx-day">${dayLabel(d)}</div>`}
    h+=wxMsgHTML(m);
  }
  if(!list.length)h+=`<div class="ibx-empty">${S.ibxQ?`没有找到「${esc(S.ibxQ)}」`:"这个聊天没有消息"}</div>`;
  return h;
}
function unreadMsgs(c){return (S.msgs&&S.msgs.chat===c.id?S.msgs.list:[]).filter(m=>!c.readUpTo||m.time>c.readUpTo)}

/* ---- 头部、底部 ---- */
function renderIbxHead(c){
  const search=`<label class="search"><svg class="i"><use href="#i-search"/></svg><input id="ibxQ" type="search" placeholder="在这里找" value="${esc(S.ibxQ)}" aria-label="在这个会话里搜索"></label>`;
  const back=`<button class="ic back" data-ibxback title="会话列表" aria-label="会话列表">‹</button>`;
  if(!c){const n=inboxItems().length;
    return `${back}<h2>随手记</h2><span class="sub">${n?`${n} 条待归类 · 鼠标移到消息上可以归类`:"发给自己的东西先放这里"}</span><span class="grow"></span>${search}`}
  const sub=[`${c.count} 条`,c.unread?`未处理 ${c.unread} 条`:"都处理过了",c.readUpTo?`已处理到 ${shortTime(c.readUpTo)}`:""].filter(Boolean).join(" · ");
  return `${back}<h2 title="${esc(c.name)}">${esc(c.name)}</h2><span class="sub">${esc(sub)}</span><span class="grow"></span>${search}<button class="btn" data-wximport title="导入这个聊天新的导出">${ico("plus")}导入</button><button class="ic" data-chatset title="聊天设置" aria-label="聊天设置">${ico("gear")}</button>`;
}
function renderIbxBottom(c){

      ${u?`<button class="btn" data-wx="selunread">选中未处理的 ${u} 条</button><button class="btn ghost" data-wx="readall">全部标为已处理</button>`:""}`;return}
